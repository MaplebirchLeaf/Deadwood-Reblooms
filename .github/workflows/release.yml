name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod and protection tool
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(bun -e "console.log(require('./package.json').version)")"
          dependency_version="$(bun -e "console.log(require('./package.json').scml.dependenceInfo.find(dep => dep.modName === 'GameVersion').version)")"
          if [[ "$RELEASE_TAG" != "v$package_version" || "$dependency_version" != ">=0.5.12.13" ]]; then
            echo "Release does not match $RELEASE_TAG for DoL 0.5.12.13" >&2
            exit 1
          fi

      - name: Install dependencies and protection tool
        run: |
          bun install --frozen-lockfile
          (cd tools/dol-mod-protection-tools && bun install --frozen-lockfile)

      - name: Check sources
        run: |
          bun run check
          bunx tsc --noEmit --pretty false

      - name: Build mod and audio package
        run: bun run build:all

      - name: Encrypt without player credentials
        run: bun run scripts/protected-release.ts

      - name: Publish encrypted packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          packages=(package/*.modpack)
          if [[ "${#packages[@]}" -ne 2 ]]; then
            echo "Expected two encrypted modpacks, found ${#packages[@]}" >&2
            exit 1
          fi
          notes_file=".github/release-notes/$RELEASE_TAG.md"
          if [[ -s "$notes_file" ]]; then
            gh release create "$RELEASE_TAG" "${packages[@]}" --verify-tag --title "Deadwood Reblooms-$RELEASE_TAG" --notes-file "$notes_file"
          else
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi
