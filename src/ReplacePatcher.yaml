- comment: '将神圣转化加成接入当前技能值。'
  fileName: 'ingame.js'
  from: 'window.currentSkillValue = currentSkillValue;'
  to: |
    window.currentSkillValue = ((original) => function (skill, ...args) {
      const result = original.call(this, skill, ...args);
      return maplebirch.get('VanillaPlus')?.divineTransformations.skillValue(skill, result) ?? result;
    })(currentSkillValue);

