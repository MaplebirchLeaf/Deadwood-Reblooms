- comment: '六级马化降低行动产生的疲劳。'
  fileName: 'stat-changes.js'
  from: 'if (source === "pass") {'
  before: |
    if (maplebirch.get('MoreTransformations') && amount > 0 && V.maplebirch?.transformation?.horse?.level >= 6) fatigueMod *= 0.75;

- comment: '意志突破后允许正常增益继续填充扩展后的六级上限。'
  fileName: 'stat-changes.js'
  from: 'V.willpower = Math.clamp(V.willpower + amount * 2, 0, V.willpowermax'
  to: "V.willpower = Math.clamp(V.willpower + amount * 2, maplebirch.get('VP')?.minimum('willpower') ?? 0, (V.VanillaPlus?.lock?.willpower ? Math.floor(V.willpowermax * 1.25) : V.willpowermax)"
- comment: '容貌突破后允许原版美容增益继续填充扩展后的六级上限。'
  fileName: 'stat-changes.js'
  from: 'maxValue = V.beautymax; // Special-case for the $beautymax value'
  to: |
    maxValue = maplebirch.get('VP') && V.VanillaPlus?.lock?.beauty ? Math.floor(V.beautymax * 1.25) : V.beautymax; // Special-case for the $beautymax value
- comment: '六项属性全满后，原版美容变化不能令容貌从突破后的峰值降低。'
  fileName: 'stat-changes.js'
  from: 'V[type] = Math.clamp(V[type] + amount, 0, maxValue);'
  to: |
    V[type] = Math.clamp(V[type] + amount, type === 'beauty' ? (maplebirch.get('VP')?.minimum('beauty') ?? 0) : 0, maxValue);

- comment: '六项属性全满后，创伤溢出不能令容貌从突破后的峰值降低。'
  fileName: 'stat-changes.js'
  from: 'V.beauty -= overflow * 0.2;'
  to: |
    V.beauty = Math.max(maplebirch.get('VP')?.minimum('beauty') ?? 0, V.beauty - overflow * 0.2);

- comment: '六项属性全满后，每日衰减不能令暴露癖从突破后的峰值降低。'
  fileName: 'time.js'
  from: 'V.exhibitionism = Math.max(V.exhibitionism - 1, 0);'
  to: |
    V.exhibitionism = Math.max(V.exhibitionism - 1, maplebirch.get('VP')?.minimum('exhibitionism') ?? 0);

- comment: '六项属性全满后，每日衰减不能令淫乱从突破后的峰值降低。'
  fileName: 'time.js'
