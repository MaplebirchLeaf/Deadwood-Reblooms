  from: 'window.currentSkillValue = currentSkillValue;'
  to: |
    window.currentSkillValue = ((original) => function (skill, ...args) {
      const result = original.call(this, skill, ...args);
      if (args[0] >= 2) return result;
      const value = maplebirch.get('VanillaPlus')?.divineTransformations.skillValue(skill, result) ?? result;
      const modifier = skill === 'willpower' ? maplebirch.get('Psyche')?.willpower ?? 1 : 1;
      return modifier === 1 ? value : Math.floor(value * modifier);
    })(currentSkillValue);

