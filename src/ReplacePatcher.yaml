- comment: '意志突破后允许正常增益继续填充扩展后的六级上限。'
  fileName: 'stat-changes.js'
  from: 'V.willpower = Math.clamp(V.willpower + amount * 2, 0, V.willpowermax'
  to: "V.willpower = Math.clamp(V.willpower + amount * 2, maplebirch.get('VanillaPlus')?.minimum('willpower') ?? 0, (maplebirch.get('VanillaPlus') && V.VanillaPlus?.lock?.willpower ? Math.floor(V.willpowermax * 1.25) : V.willpowermax)"

- comment: '容貌突破后允许原版美容增益继续填充扩展后的六级上限。'
  fileName: 'stat-changes.js'
  from: 'maxValue = V.beautymax; // Special-case for the $beautymax value'
  to: |
    maxValue = maplebirch.get('VanillaPlus') && V.VanillaPlus?.lock?.beauty ? Math.floor(V.beautymax * 1.25) : V.beautymax; // Special-case for the $beautymax value

- comment: '六项属性全满后，原版美容变化不能令容貌从突破后的峰值降低。'
  fileName: 'stat-changes.js'
  from: 'V[type] = Math.clamp(V[type] + amount, 0, maxValue);'
  to: |
    V[type] = Math.clamp(V[type] + amount, type === 'beauty' ? (maplebirch.get('VanillaPlus')?.minimum('beauty') ?? 0) : 0, maxValue);

- comment: '六项属性全满后，创伤溢出不能令容貌从突破后的峰值降低。'
  fileName: 'stat-changes.js'
  from: 'V.beauty -= overflow * 0.2;'
  to: |
    V.beauty = Math.max(maplebirch.get('VanillaPlus')?.minimum('beauty') ?? 0, V.beauty - overflow * 0.2);

