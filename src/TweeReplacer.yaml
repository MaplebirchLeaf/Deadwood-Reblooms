- passage: Widgets Sydney
  # 普通交谈菜单主动展示吊坠，原版的偶遇反应照常。
  findString: '<<widget "sydneyOptionsTalk">>'
  after: "\n\t<<deadwood-locket-link 'Sydney'>>"

- passage: Widgets Kylar
  findString: '<<if _lewdIdea>>'
  before: "<<deadwood-locket-link 'Kylar'>>\n\t\t"

- passage: Widgets Robin
  findString: '<<robinbully>>'
  before: "<<deadwood-locket-link 'Robin'>>\n\t\t"

- passage: Widgets Whitney
  findString: '<<if !_noOptions>>'
  after: "\n\t\t\t<<deadwood-locket-link 'Whitney'>>"

- passage: Mansion Talk
  findString: '<<if isLoveInterest("Avery") and !$daily.avery.talk.flirt and $avery_pool isnot "swim">>'
  before: "<<deadwood-locket-link 'Avery'>>\n\t\t"

- passage: Farm Widgets
  findString: '<<couchicon>>'
  before: "<<deadwood-locket-link 'Alex'>>\n\t\t\t"

- passage: Gwylan Widgets
  findString: '<<gwylanOptionsRequest>>'
  before: "<<deadwood-locket-link 'Gwylan'>>\n\t\t"

- passage: Mirror Locket
  # 模组扩展的恋人照片只补文字，图片仍沿用原版缺图回退。
  findString: '<<switch $carried.neck.photo>>'
  after: |-

    <<case 'Remy'>>
      <<set _locket_text to lanSwitch('A photograph of Remy looks back at you.', '照片里的雷米正望向你。')>>
    <<case 'Tsukihan'>>
      <<set _locket_text to lanSwitch('Tsukihan smiles back at you in the photograph.', '照片里的月羽正对你微笑。')>>

- passage: Mirror Locket 2
  findString: '<<switch $carried.neck.photo>>'
  after: |-

    <<case 'Remy'>>
      <<lanSwitch 'You insert a small photograph of Remy.' '你放入一张雷米的小照片。'>>
    <<case 'Tsukihan'>>
      <<lanSwitch 'You insert a small photograph of Tsukihan.' '你放入一张月羽的小照片。'>>

- passage: Mirror Locket
  # 只追加查看照片的心境，原版图片、换照与幻象仍在原处处理。
  findString: '<<if $options.images>>'
  before: |-
    <<if $carried.neck.photo and !_noLocketPhoto>>
      <<set _locket_text += '<br><br><<deadwood-locket-memory>>'>>
    <</if>>

- passage: Widgets NPCs
  # 补充恋人首次发现异装的入口，后续反应仍由原版处理。
  findRegex: >-
    (?<=<<elseif \$crossdressing is 2>>[^\n]*\n\s*<<if \$npc\.length is 1 and \()\["Kylar","Sydney","Gwylan","Avery"\]
  replace: >-
    ["Kylar","Sydney","Gwylan","Avery","Robin","Whitney","Alex","Eden"]

- passage: Widgets NPCs
  # 双性特征的首次发现使用共用 widget。
  findRegex: >-
    <<if(?= \$npc\[0\] is "Sydney" and !\$sydneySeen\.includes\("herm"\)>>)
  replace: >-
    <<if ["Robin","Whitney","Alex","Eden"].includes($npc[0])>><<deadwood-reblooms-li-discovery>><<elseif

- passage: Traits
  # 保留原版的称号判断，只在返回名称后补生理标记。
  findRegex: >-
    name: \(\) => (V\.player\.gender is "n" \? "[^"]+" : "[^"]+"|(?:V\.hallucinations gte 2 \|\| !V\.settings\.bestialityEnabled|resolveIfNamedBeastIsMonster\("greathawk"\)) \? "[^"]+" : V\.player\.gender is "n" \? "[^"]+" : "[^"]+"),
  replace: >-
    name: () => ($1) + "<<deadwood-trait-sex>>",
  all: true

- passage: Traits
  # 牛、狐称号已有多条性别分支，只在各分支的返回值上补标记。
  findRegex: >-
    return "(Bull(?: <<pcGender>>)?|Cow(?: <<pcGender>>)?|Fox(?: <<pcGender>>)?|Vixen|公牛(?:<<pcGender>>)?|奶牛(?:<<pcGender>>)?|雄狐|狐<<pcGender>>|雌狐)";
  replace: >-
    return "$1<<deadwood-trait-sex>>";
  all: true

- passage: Traits
  # 保留原版恶魔的异装称谓，固定生理标签统一为同一标记。
  findRegex: >-
    return "(Incubus|Succubus|魅影|魅魔)(?: \((?:female|male)\)|\([♀♂]\))?";
  replace: >-
    return "$1<<deadwood-trait-sex>>";
  all: true
