EN:
  up:
    - You feel drawn to the water.
    - You find you can hold your breath longer.
    - Your limbs begin to feel like fins.
    - A pair of fins grows beside your ears.
    - Your lower back begins to tingle.
    - A fish tail grows from your lower back.

  down:
    - Your attraction to the water fades.
    - You can no longer hold your breath as long.
    - Your limbs no longer feel like fins.
    - The fins beside your ears disappear.
    - Your lower back stops tingling.
    - Your fish tail disappears.

CN:
  up:
    - 你开始受到水域的吸引。
    - 你发现自己能屏息更久了。
    - 你的四肢开始呈现鱼鳍的特征。
    - 你的耳侧长出一对鳍。
    - 你的后腰开始发痒。
    - 一条鱼尾从你的后腰长了出来。

  down:
    - 水域对你的吸引逐渐消退。
    - 你不再能像以前那样长时间屏息。
    - 你的四肢不再呈现鱼鳍的特征。
    - 你耳侧的鳍消失了。
    - 你的后腰不再发痒。
    - 你的鱼尾消失了。
