EN:
  up:
    - You feel drawn to the water.
    - Gills form along your neck.
    - Your limbs begin to feel like fins.
    - Fins grow from the sides of your head.
    - Your lower back begins to tingle.
    - A fish tail grows from your lower back.

  down:
    - Your attraction to the water fades.
    - The gills along your neck disappear.
    - Your limbs no longer feel like fins.
    - The fins on your head disappear.
    - Your lower back stops tingling.
    - Your fish tail disappears.

CN:
  up:
    - 你开始受到水域的吸引。
    - 鱼鳃在你的颈侧形成。
    - 你的四肢开始呈现鱼鳍的特征。
    - 鱼鳍从你的头部两侧长出。
    - 你的后腰开始发痒。
    - 一条鱼尾从你的后腰长了出来。

  down:
    - 水域对你的吸引逐渐消退。
    - 你颈侧的鱼鳃消失了。
    - 你的四肢不再呈现鱼鳍的特征。
    - 你头部两侧的鱼鳍消失了。
    - 你的后腰不再发痒。
    - 你的鱼尾消失了。
