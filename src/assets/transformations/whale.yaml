EN:
  up:
    - You feel an urge to drift with the water.
    - A deep breath lasts longer than it used to, even beneath the surface.
    - Your hands and feet broaden, their edges softening into fins.
    - A pair of fins grows beside your ears.
    - A dull ache spreads across your lower back.
    - A broad whale tail grows from your lower back, ending in two flattened flukes.

  down:
    - The urge to drift with the water fades.
    - You need to surface for air sooner than before.
    - Your hands and feet narrow, losing their finlike edges.
    - The fins beside your ears disappear.
    - The ache in your lower back fades.
    - Your whale tail disappears.

CN:
  up:
    - 你开始渴望随水漂浮。
    - 深吸的一口气比以前维持得更久，即使潜入水下也是如此。
    - 你的手脚变得宽阔，边缘渐渐呈现鳍的形状。
    - 你的耳侧长出一对鳍。
    - 你的后腰泛起一阵钝痛。
    - 一条宽阔的鲸尾从你的后腰长出，末端分成两片扁平的尾叶。

  down:
    - 随水漂浮的渴望逐渐消退。
    - 你需要比以前更早浮出水面换气。
    - 你的手脚变得窄小，边缘不再呈现鳍的形状。
    - 你耳侧的鳍消失了。
    - 你后腰的钝痛逐渐消退。
    - 你的鲸尾消失了。
