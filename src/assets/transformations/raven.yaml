EN:
  up:
    - Your eyes are drawn to distant movement.
    - Your sight grows sharper.
    - Your skin begins to itch beneath your clothes.
    - Dark feathers cover patches of your skin. A feathered tail has grown.
    - Your back aches as feathers push through your skin.
    - A pair of raven wings has grown. Your voice carries more clearly.

  down:
    - Distant movement no longer catches your attention.
    - Your sight returns to normal.
    - Your skin stops itching.
    - Your dark feathers and feathered tail have disappeared.
    - The ache in your back fades.
    - Your raven wings have disappeared. Your voice returns to normal.

CN:
  up:
    - 远处的动静吸引着你的目光。
    - 你的视力变得更加敏锐。
    - 衣物下的皮肤开始发痒。
    - 黑色羽毛覆住了你身上的部分皮肤。你长出了一簇尾羽。
    - 羽毛从皮肤下钻出，你的背部隐隐作痛。
    - 一对渡鸦羽翼从你的背部长出。你的声音变得更加清晰有力。

  down:
    - 远处的动静不再牵引你的注意。
    - 你的视力恢复了正常。
    - 你的皮肤不再发痒。
    - 你身上的黑色覆羽与尾羽消失了。
    - 背部的疼痛渐渐消退。
    - 你的渡鸦羽翼消失了。你的声音恢复了正常。
