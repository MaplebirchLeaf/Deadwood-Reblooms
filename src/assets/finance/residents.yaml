# 四位校园恋人可在玩家自住房过夜。是否为当前恋人由原版 isLoveInterest 判断。
- id: Robin
  welcome:
    EN: Robin takes the key and smiles. "I'll still help at the orphanage during the day," Robin says. "But I can come home to you."
    CN: 罗宾接过钥匙，笑了。“白天我还会去孤儿院帮忙，”罗宾说，“晚上就回这里陪你。”
  evening:
    EN: Robin's coat hangs by the door. Robin is waiting for you in the sitting room.
    CN: 罗宾的外套挂在门边。罗宾正在起居室等你。
  together:
    EN: You sit beside Robin and ask about the day at the orphanage.
    CN: 你在罗宾身边坐下，问起孤儿院今天的事。

- id: Whitney
  welcome:
    EN: Whitney turns the key over in one hand. "You want me living with you?" Whitney asks. "Fine. Keep a drawer free for my things."
    CN: 惠特尼拿着钥匙在手里转了转。“你想让我搬过去？”惠特尼问。“行。给我的东西留个抽屉。”
  evening:
    EN: Whitney's bag is by the door. A familiar voice calls to you from the sitting room.
    CN: 惠特尼的包放在门边。起居室里传来熟悉的声音。
  together:
    EN: You sit beside Whitney. For once there is no one else in the room.
    CN: 你在惠特尼身边坐下。这回屋里只有你们两个人。

- id: Kylar
  welcome:
    EN: Kylar closes a hand around the spare key. "You'll really let me stay?" Kylar asks, smiling before you can answer.
    CN: 凯拉尔攥住备用钥匙。“你真的让我住下？”还没等你回答，凯拉尔就笑了。
  evening:
    EN: Kylar's things are beside the bed. You hear footsteps when you open the door.
    CN: 凯拉尔的东西放在床边。你推开门，听见脚步声。
  together:
    EN: Kylar sits close and asks whether you are glad to have company.
    CN: 凯拉尔紧挨着你，问你是否高兴有人作伴。

- id: Sydney
  welcome:
    EN: Sydney accepts the key. "I still have duties at the temple," Sydney says, "but I can come home to you."
    CN: 悉尼接过钥匙。“白天我还得去神殿，”悉尼说，“忙完就回这里陪你。”
  evening:
    EN: Sydney has returned from the temple. A book lies open on the table.
    CN: 悉尼从神殿回来了。桌上摊着一本书。
  together:
    EN: Sydney sits beside you and asks how you spent the day.
    CN: 悉尼在你身边坐下，问你今天过得怎么样。
