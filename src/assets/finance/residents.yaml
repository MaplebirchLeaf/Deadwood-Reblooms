# 只有 listed 角色可在玩家自住房过夜。原版的白天活动地点不随同住而改变。
# minimumLove 是 NPC 对 PC 的好感门槛；还须是当前恋爱对象且满足原版恋爱条件。
- id: Robin
  minimumLove: 40
  welcome:
    EN: Robin looks around the room, then takes your hand. "I'll still help at the orphanage during the day," Robin says. "But I'd like to come home to you."
    CN: 罗宾环顾房间，握住你的手。“白天我还会去孤儿院帮忙，”罗宾说，“但晚上我想回到你身边。”
  decline:
    EN: Robin hesitates. "I care about you, but I'm not ready to leave the orphanage at night yet."
    CN: 罗宾有些犹豫。“我在乎你，但我还没准备好夜里离开孤儿院。”
  evening:
    EN: Robin has come back from the orphanage and is resting in your home.
    CN: 罗宾从孤儿院回来，正在家里休息。
  together:
    EN: You sit close to Robin and talk about the day. Robin's hand finds yours before the conversation ends.
    CN: 你靠着罗宾，聊起今天的事。话还没说完，罗宾已经牵住了你的手。

- id: Whitney
  minimumLove: 30
  welcome:
    EN: Whitney gives the room an appraising glance. "You want me here?" Whitney asks, trying to sound unimpressed. A moment later, Whitney drops a bag beside the door.
    CN: 惠特尼打量着房间。“你想让我住这儿？”惠特尼故作不在意。片刻后，惠特尼把包放在门边。
  decline:
    EN: Whitney scoffs at the invitation and changes the subject. Whatever Whitney feels, moving in is too much to ask today.
    CN: 惠特尼嗤了一声，转开话题。不管心里怎么想，今天谈同住还是太早了。
  evening:
    EN: Whitney's bag is by the door. Whitney is sprawled across a chair as though the place has always been familiar.
    CN: 惠特尼的包放在门边。惠特尼瘫坐在椅子上，仿佛早就熟悉这里。
  together:
    EN: Whitney teases you about the house, then stays beside you long after the joke has run out.
    CN: 惠特尼拿房子打趣你。玩笑过去了，惠特尼却仍挨着你坐。

- id: Kylar
  minimumLove: 40
  welcome:
    EN: Kylar holds the spare key so tightly that it leaves a mark in Kylar's palm. "You'll really let me stay?" Kylar asks, smiling before you can answer.
    CN: 凯拉尔把备用钥匙攥得掌心发红。“你真的让我住下？”还没等你回答，凯拉尔就笑了。
  decline:
    EN: Kylar grips your sleeve, but cannot bring themself to accept yet. The thought of sharing a home leaves Kylar trembling.
    CN: 凯拉尔抓紧你的袖口，却还无法答应。想到要同住，凯拉尔紧张得发抖。
  evening:
    EN: Kylar has left a few things beside the bed and looks up as soon as you enter.
    CN: 凯拉尔在床边放了几样自己的东西，一听见你进门便抬起头来。
  together:
    EN: Kylar settles beside you and listens to every word, reluctant to let the quiet evening end.
    CN: 凯拉尔依偎着你，认真听你说每一句话，舍不得让这个安静的夜晚结束。

- id: Sydney
  minimumLove: 40
  welcome:
    EN: Sydney smiles at the offered key. "I still have duties at the temple," Sydney says, "but I can spend my nights with you."
    CN: 悉尼看着你递来的钥匙笑了。“我白天仍要履行神殿的职责，”悉尼说，“但夜里可以陪着你。”
  decline:
    EN: Sydney gently returns the key. "I need a little more time before I can make a promise like that."
    CN: 悉尼轻轻把钥匙还给你。“在许下这样的承诺前，我还需要一点时间。”
  evening:
    EN: Sydney has finished the day's duties at the temple and is spending the evening here.
    CN: 悉尼结束了今天在神殿的事务，正在这里度过夜晚。
  together:
    EN: Sydney sits with you in the quiet. For a while, neither of you needs to speak.
    CN: 悉尼与你安静地坐在一起。有一阵子，你们谁也不用开口。

# 这些恋人有与剧情紧密绑定的住处和职责，当前不会离开那里同住。
- id: Alex
  decline:
    EN: Alex cannot leave the farm to live in town, but promises to visit when work allows.
    CN: 艾利克斯无法离开农场搬进镇上，但答应有空时来看看你。
- id: Eden
  decline:
    EN: Eden refuses to trade the cabin and forest for a town house.
    CN: 伊甸不愿用森林里的木屋换一间镇上的房子。
- id: Avery
  decline:
    EN: Avery has no intention of moving out of the mansion, whatever Avery thinks of you.
    CN: 不管艾弗里对你有什么想法，都没有搬离宅邸的打算。
- id: Black Wolf
  decline:
    EN: The wolf belongs to the forest and will not settle inside a town house.
    CN: 黑狼属于森林，不会在镇上的房子里安家。
- id: Great Hawk
  decline:
    EN: The hawk will not abandon the eyrie for walls and a roof in town.
    CN: 巨鹰不会离开鹰巢，住进镇上的砖墙与屋顶之下。
- id: Gwylan
  decline:
    EN: Gwylan will not leave the place that is already home.
    CN: 格威兰不愿离开已有的家园。
