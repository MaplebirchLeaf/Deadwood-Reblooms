# 四位校园恋人可在玩家自住房过夜。是否为当前恋人由原版 isLoveInterest 判断。
- id: Robin
  welcome:
    EN: Robin takes the key and smiles. "I'll still help at the orphanage during the day," Robin says. "But I can come home to you."
    CN: 罗宾接过钥匙，笑了。“白天我还会去孤儿院帮忙，”罗宾说，“晚上就回这里陪你。”
  evening:
    EN: Robin's coat hangs by the door. A cushion has been left beside Robin's seat, <span class='teal'>ready for you</span>.
    CN: 罗宾的外套挂在门边。<<He>>在自己的座位旁留了个软垫，<span class='teal'>给你坐</span>。
  together:
    EN: You settle beside Robin. The room is quiet enough that neither of you needs to whisper to avoid waking the other orphans.
    CN: 你在罗宾身旁坐下。屋子里很安静，你们也不必担心吵醒其他孤儿，压低声音说话。

- id: Whitney
  welcome:
    EN: Whitney turns the key over in one hand. "You want me living with you?" Whitney asks. "Fine. Keep a drawer free for my things."
    CN: 惠特尼拿着钥匙在手里转了转。“你想让我搬过去？”惠特尼问。“行。给我的东西留个抽屉。”
  evening:
    EN: Whitney's bag has been dropped just inside the door. "Took your time," Whitney calls from the sitting room, <span class='teal'>moving the bag out of your way with a foot</span>.
    CN: 惠特尼把包丢在门边。“够磨蹭的。”起居室里传来<<his>>的声音。<<He>>用脚<span class='teal'>把挡路的包挪开</span>。
  together:
    EN: Whitney takes up most of the seat. "There's room. Stop hovering." You sit in the space Whitney grudgingly leaves for you.
    CN: 惠特尼占了大半个位子。“坐得下。别晃来晃去的。”你坐进<<he>>不情不愿挪出来的空处。

- id: Kylar
  welcome:
    EN: Kylar closes a hand around the spare key. "You'll really let me stay?" Kylar asks, smiling before you can answer.
    CN: 凯拉尔攥住备用钥匙。“你真的让我住下？”还没等你回答，凯拉尔就笑了。
  evening:
    EN: Footsteps hurry towards the door before you finish turning the key. Kylar stops just short of you. "<span class='teal'>You're back.</span>"
    CN: 钥匙还没拧到底，脚步声就急急朝门口赶来。凯拉尔在你面前停下。“<span class='teal'>你回来了。</span>”
  together:
    EN: Kylar sits close, looking at your face whenever you pause. "We don't have to go anywhere else, do we?"
    CN: 凯拉尔挨着你坐下，你一停顿，<<he>>就抬眼看你。“我们不用再去别的地方了吧？”

- id: Sydney
  welcome:
    EN: Sydney accepts the key. "I still have duties at the temple," Sydney says, "but when I'm free, I can come back here. To you."
    CN: 悉尼接过钥匙。“神殿的职责还是得照做，”悉尼说，“不过得空了，就能回这里。回到你身边。”
  evening:
    EN: Sydney's glasses rest beside a closed book. Sydney stifles a yawn, then <span class='teal'>smiles when you come in</span>.
    CN: 悉尼的眼镜搁在合上的书旁。<<He>>忍住一个呵欠，见你进来，<span class='teal'>脸上便露出了笑容</span>。
  together:
    EN: Sydney puts the book aside before you sit down. "Tell me about your day. I've had enough of reading about everyone else's."
    CN: 你还没坐下，悉尼就把书放到一边。“说说你今天过得怎么样吧。我都看够别人过得怎么样了。”
