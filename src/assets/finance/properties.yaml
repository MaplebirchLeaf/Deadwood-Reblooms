  name: { EN: Skyscraper penthouse, CN: 摩天大楼顶层套房 }
  entry_label: { EN: Take the lift to your suite (0:02), CN: 乘电梯回套房 (0:02) }
  description:
    EN: A private suite occupies one side of the skyscraper's uppermost floors. Its entrance is separate from Avery's office.
    CN: 私人套房占据摩天大楼最高几层的一侧，入口与艾弗里的办公室分开。
  floors:
    - name: { EN: Living level, CN: 起居层 }
      description:
        EN: The lift opens into a quiet entrance hall. Beyond the sitting room windows, the factories lie far below. A door beside the stairs leads to the kitchen. You can hear water circulating behind the lounge wall.
        CN: 电梯门在安静的门厅敞开。透过起居室的窗户，工厂显得遥远而低矮。楼梯旁的门通向厨房，会客厅的墙后传来水流循环的声音。
    - name: { EN: Private level, CN: 私人层 }
      description:
        EN: A carpeted passage connects the bedrooms, bathroom and study. Daylight falls through a glass door at the far end. The garden is beyond it, behind a high windbreak.
        CN: 铺着地毯的走廊连接卧室、浴室与书房。尽头的玻璃门透进天光，门外的花园被高高的挡风屏围住。
  rooms: { bedroom: 2, bathroom: 2, kitchen: 1, desk: 2, guest: 2, outdoor: 2 }
  extensions:
    - id: lounge
      icon: couch.png
      floor: 1
      access: sitting
      cost: 0
      upkeep: 4000
      name: { EN: Panorama lounge, CN: 观景会客厅 }
      description:
        EN: Low armchairs face the wide windows. The streets are reduced to thin lines of traffic, with the sea stretching beyond the rooftops. The door to the pool is beside the drinks cabinet.
        CN: 低矮的扶手椅朝着整面玻璃窗。街上的车流缩成细线，屋顶外是铺开的海面。饮料柜旁的门通向泳池。
    - id: pool
      icon: property/pool-indoor.png
      floor: 1
      access: lounge
      cost: 0
      upkeep: 8000
      name: { EN: Indoor pool, CN: 室内泳池 }
      description:
        EN: Warm air hangs over a long pool. Glass separates the water from the drop outside, and a narrow changing area stands beside the door. The town's noise does not reach this room.
        CN: 温热的空气笼罩着狭长的泳池。玻璃隔开池水与楼外的高空，门旁留着一小块换衣的地方。小镇的喧闹传不到这里。
    - id: study
      icon: property/study.png
      floor: 2
      access: landing
      cost: 0
      upkeep: 2000
      name: { EN: Study, CN: 书房 }
      description:
        EN: A broad desk stands beneath a reading lamp. The shelves hold reference books, with space left for your own. Through the wall you can faintly hear the ventilation in the office wing.
        CN: 宽大的书桌上摆着阅读灯。书架放着工具书，也给你的书留了空位。隔着墙，能隐约听见办公室一侧的通风声。
    - id: garage
      icon: property/garage.png
      floor: 1
      access: sitting
      cost: 0
      upkeep: 1000
      name: { EN: Reserved parking, CN: 专用停车位 }
      description:
        EN: The residents' lift takes you down to the underground car park. Two marked bays are reserved for the suite, beside a locked bicycle rack. The security desk keeps a record of visitors.
        CN: 住户电梯带你下到地下车库。套房有两个划好的车位，旁边是一架可上锁的自行车架。安保台留着访客登记簿。
      parking: { bicycle: 2, motorcycle: 1, motor_vehicle: 2 }
  interior:
    bedroom_label: { EN: Main bedroom (0:01), CN: 主卧 (0:01) }
    bedroom:
      EN: Heavy curtains frame a broad window. A large bed faces it, with an organised wardrobe and a low table nearby. The glass is thick enough to keep out most of the wind.
      CN: 厚重的窗帘围着宽阔的窗户。大床朝向窗外，旁边摆着分格衣柜与矮桌。厚玻璃挡住了大部分风声。
    bathroom:
      EN: A deep bath stands beside a separate shower. Warm tiles run beneath your feet. Beyond the frosted glass, the neighbouring rooftops are barely visible.
      CN: 深浴缸旁是独立的淋浴间，脚下的瓷砖温暖。隔着磨砂玻璃，邻近的屋顶几乎看不见。
    kitchen_label: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: A long worktop runs between the oven and the refrigerator. Cupboards hold plain crockery rather than the company china. A small service door is locked from your side.
      CN: 长台面连接烤箱与冰箱。橱柜里放着普通餐具，没有公司的瓷器标记。小小的服务门从你这一侧上了锁。
    outdoor_label: { EN: Roof garden (0:01), CN: 天台花园 (0:01) }
    outdoor:
      EN: The windbreak leaves a sheltered patch around two shallow planting beds. A maintenance rail runs along the outer edge. You stay well inside it as the wind whistles past the glass.
      CN: 挡风屏内的两只浅种植箱占着一块背风的地方。外缘围着检修栏杆，风从玻璃旁尖啸着掠过，你站在离栏杆很远的地方。
    outdoor_view:
      EN: You look across the rooftops towards the sea. Smoke rises from the factories below. At this height you can follow the streets without hearing any of the people on them.
      CN: 你越过屋顶望向海面，下方的工厂升起烟柱。从这里能看清街道的走向，却听不见街上的人声。
    guest:
      EN: The second bedroom has its own bed and cupboard. A reading lamp rests beside the pillow. With the door shut, the corridor outside is almost silent.
      CN: 次卧有自己的床与储物柜。阅读灯摆在枕边，关上门后，走廊的动静几乎听不见。
    renovated:
      EN: The rooms are furnished and maintained under the company agreement.
      CN: 房间的家具与维护由公司住宿协议安排。
