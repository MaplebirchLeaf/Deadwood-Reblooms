# 金额单位是便士。floors 从入户层往上排列；rooms 指定功能房间所在的楼层（从 1 开始）。
# desk、guest 和 retreat 可以省略；单层小屋没有独立书桌或休闲房，只有宅邸设客房。
# dailyRentPercent 是各房产的每日挂牌租金率，状况与装修再参与实际租金计算。
# bedId / bedUpgradeId 引用原版家具 ID；床属于这处房产，不修改孤儿院卧室家具。
# residentCapacity 是除 PC 以外可同住的人数；普通住宅共用主卧，宅邸另有一间客房。
- id: domus
  street: Domus Street
  streetName:
    EN: Domus Street
    CN: 宅邸街
  price: 8000000
  dailyRentPercent: 0.07
  residentCapacity: 0
  bedId: singlebed
  name:
    EN: Domus Street cottage
    CN: 宅邸街小屋
  entryLabel:
    EN: Your cottage (0:02)
    CN: 你的小屋 (0:02)
  description:
    EN: A modest house with a narrow garden, close enough to see the orphanage from the street.
    CN: 这间朴素的小屋带着一方狭窄的庭院。从街上还能望见孤儿院。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: You step into a small sitting room. Light falls across the worn floorboards; beyond the window, the garden fence separates you from the street.
        CN: 你走进狭小的起居室。阳光落在磨旧的地板上；窗外的庭院围栏隔开了街上的目光。
  rooms: { bedroom: 1, bathroom: 1, kitchen: 1 }
  interior:
    bedroomLabel: { EN: Sleeping nook (0:01), CN: 睡觉的角落 (0:01) }
    bedroom:
      EN: Your bed is tucked against the sitting room wall, with a narrow wardrobe beside it. There is no room for a proper desk; the orphanage roof is visible beyond the garden fence.
      CN: 床紧贴着起居室的墙，旁边仅摆得下一只窄衣柜。这里没有放书桌的空地；越过庭院围栏还能看见孤儿院的屋顶。
    bathroom:
      EN: A narrow bath sits under the frosted window. The old pipes knock softly before the water warms.
      CN: 窄浴缸摆在磨砂窗下。水热起来之前，旧水管会轻轻敲响。
    kitchenLabel: { EN: Kitchen corner (0:01), CN: 厨房角落 (0:01) }
    kitchen:
      EN: A single hob and a battered kettle occupy the end of the sitting room. The cupboard beneath them holds just enough for a few meals.
      CN: 起居室尽头的一小块台面放着单炉灶和旧水壶。下面的橱柜只装得下几顿饭的材料。
    renovated:
      EN: Fresh paint covers the scuffed walls, and the repaired window closes without a draught.
      CN: 新漆盖住了墙上的磨痕，修好的窗户关上后也不再漏风。

- id: barb
  street: Barb Street
  streetName:
    EN: Barb Street
    CN: 倒钩街
  price: 15000000
  dailyRentPercent: 0.075
  residentCapacity: 1
  bedId: singlebed
  bedUpgradeId: doublebed
  name:
    EN: Barb Street flat
    CN: 倒钩街公寓
  entryLabel:
    EN: Your flat (0:02)
    CN: 你的公寓 (0:02)
  description:
    EN: A clean flat above the dried canal. Traffic hums beyond the window.
    CN: 干涸运河旁的公寓整洁明亮。窗外隐隐传来车流声。
  floors:
    - name: { EN: Flat, CN: 公寓 }
      description:
        EN: You climb the stairs to your flat. The sitting room looks out over the empty canal, while traffic rolls past on the far bank.
        CN: 你爬上楼梯，走进自己的公寓。起居室朝着干涸的运河，车流从对岸驶过。
  rooms: { bedroom: 1, bathroom: 1, kitchen: 1, desk: 1, retreat: 1 }
  interior:
    bedroomLabel: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom door muffles the road noise. A desk fits beneath the window, with the wardrobe against the opposite wall.
      CN: 卧室的门挡住了道路的喧闹。书桌安在窗下，衣柜靠着对面的墙。
    bathroom:
      EN: White tiles line the compact bathroom. Running water drowns out the traffic outside.
      CN: 紧凑的浴室铺着白瓷砖。水声盖过了外面的车流声。
    kitchenLabel: { EN: Kitchenette (0:01), CN: 小厨房 (0:01) }
    kitchen:
      EN: A small counter divides the kitchenette from the sitting room. A kettle, two burners and a narrow cupboard fit along the wall.
      CN: 一段矮柜把小厨房与起居室隔开。水壶、双炉灶和窄橱柜沿墙排开。
    retreatLabel: { EN: Window seat (0:01), CN: 窗边座位 (0:01) }
    retreat:
      EN: A cushioned seat fills the recess beside the canal-facing window. There is only room for one person, but the noise of the road feels farther away here.
      CN: 朝向运河的窗边嵌着一张软垫座位。这里只坐得下一个人，路上的喧闹却仿佛远了一些。
    retreatRest:
      EN: You watch the canal from the window seat until your shoulders relax.
      CN: 你坐在窗边望着运河，直到肩膀慢慢放松。
    renovated:
      EN: New fittings brighten the flat, and the sealed windows keep the canal air outside.
      CN: 新装的家具让公寓明亮起来，密封好的窗户把运河边的风挡在外面。

- id: high
  street: High Street
  agency: true
  streetName:
    EN: High Street
    CN: 商业街
  price: 25000000
  dailyRentPercent: 0.08
  residentCapacity: 1
  bedId: doublebed
  bedUpgradeId: doublebeddeluxe
  name:
    EN: High Street loft
    CN: 商业街楼上住宅
  entryLabel:
    EN: Your loft (0:02)
    CN: 你的阁楼 (0:02)
  description:
    EN: A private loft over the shops, with the bustle of the market below.
    CN: 店铺楼上的私人住所。楼下的商业街终日热闹。
  floors:
    - name: { EN: Lower loft, CN: 阁楼下层 }
      description:
        EN: You shut the loft door behind you. Shop signs glow below the sitting room windows, and voices drift up from the pavement.
        CN: 你关上阁楼的门。店铺招牌的灯光映在起居室窗上，人声从楼下的人行道飘上来。
    - name: { EN: Upper loft, CN: 阁楼上层 }
      description:
        EN: A short staircase leads to the quieter upper level. The sloping roof leaves room for a bedroom and a writing desk.
        CN: 一段短楼梯通向较为安静的上层。倾斜的屋顶下留着卧室与书桌的位置。
  rooms: { bedroom: 2, bathroom: 1, kitchen: 1, desk: 2, retreat: 2 }
  interior:
    bedroomLabel: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: A partition separates the bed from the rest of the loft. The wardrobe and desk sit beneath the sloping roof.
      CN: 一道隔板把床与阁楼的其余空间分开。衣柜和书桌摆在倾斜的屋顶下。
    bathroom:
      EN: The tiled bathroom is tucked behind the stairs. Steam fogs its small skylight when the bath fills.
      CN: 铺瓷砖的浴室藏在楼梯后面。浴缸放满水时，蒸汽会蒙住小小的天窗。
    kitchenLabel: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The kitchen occupies a separate room beside the lower loft. Its broad counter catches the last light from the shop windows.
      CN: 厨房是阁楼下层旁边的独立房间。宽阔的台面映着店铺窗外最后一抹光。
    retreatLabel: { EN: Reading alcove (0:01), CN: 阅读角 (0:01) }
    retreat:
      EN: A low bookcase and an armchair sit beneath the upper roof window. The shopkeepers' voices are only a murmur from up here.
      CN: 矮书柜与扶手椅摆在上层的天窗下。从这里听去，店铺里的人声只剩模糊的低语。
    retreatRest:
      EN: You settle into the armchair and let the noises of the market fade.
      CN: 你陷进扶手椅里，任由市场的喧闹渐渐远去。
    renovated:
      EN: Thick curtains and a new partition give you a little quiet above the busy shops.
      CN: 厚窗帘和新隔板让你在热闹的店铺上方也能有片刻安静。

- id: cliff
  street: Cliff Street
  streetName:
    EN: Cliff Street
    CN: 峭壁街
  price: 40000000
  dailyRentPercent: 0.065
  residentCapacity: 1
  bedId: doublebeddeluxe
  name:
    EN: Cliff Street sea-view house
    CN: 峭壁街海景住宅
  entryLabel:
    EN: Your sea-view house (0:02)
    CN: 你的海景住宅 (0:02)
  description:
    EN: A quiet house facing the sea. Salt air reaches even the bedroom.
    CN: 安静的房子面朝大海。连卧室里也能闻到海风的咸味。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: The sitting room faces the sea. Waves break below the cliff, and the windows rattle whenever the wind rises.
        CN: 起居室面朝大海。浪花在峭壁下碎开；风一起，窗户便轻轻作响。
    - name: { EN: Upper floor, CN: 二层 }
      description:
        EN: The stairs rise towards a sea-facing window. The landing is quiet except for the wind beyond the glass.
        CN: 楼梯向一扇朝海的窗户延伸。除了玻璃外的风声，二层楼梯间一片安静。
  rooms: { bedroom: 2, bathroom: 1, kitchen: 1, desk: 2, retreat: 2 }
  interior:
    bedroomLabel: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom overlooks the water. A bed, desk and wardrobe stand well back from the salt-streaked window.
      CN: 卧室俯瞰海面。床、书桌和衣柜摆在窗后，离沾着盐痕的玻璃有些距离。
    bathroom:
      EN: The bathroom is warm despite the sea wind. You can hear the surf through the vent above the bath.
      CN: 海风吹不进温暖的浴室。泡澡时，你仍能从通风口听见潮声。
    kitchenLabel: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The kitchen sits on the sheltered side of the house. A sturdy table and deep cupboards leave room to prepare food while the wind shakes the seaward windows.
      CN: 厨房位于房子背风的一侧。结实的餐桌与深橱柜留出烹饪空间，海侧的窗户在风中作响。
    retreatLabel: { EN: Sea-view alcove (0:01), CN: 观海角 (0:01) }
    retreat:
      EN: A broad chair faces the sea through a sheltered upper window. A thick blanket lies folded over its arm.
      CN: 二层一扇避风的窗前摆着宽椅，正对大海。扶手上叠着一条厚毯。
    retreatRest:
      EN: You draw the blanket over your knees and listen to the waves below.
      CN: 你把毯子盖在膝上，听着下方的浪声。
    renovated:
      EN: Reinforced windows quiet the wind, leaving the view of the sea undisturbed.
      CN: 加固过的窗户挡住了风声，海景仍然清晰地展现在眼前。

- id: danube
  street: Danube Street
  streetName:
    EN: Danube Street
    CN: 多瑙河街
  price: 60000000
  dailyRentPercent: 0.055
  residentCapacity: 2
  bedId: doublebedexotic
  name:
    EN: Danube Street manor
    CN: 多瑙河街宅邸
  entryLabel:
    EN: Your manor (0:02)
    CN: 你的宅邸 (0:02)
  description:
    EN: A secluded manor behind high walls and a sweeping garden.
    CN: 高墙与宽阔花园围起的宅邸，街上的目光被留在门外。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: You cross the entrance hall into a broad sitting room. Beyond the tall windows, the garden stretches to the walls that hide the house from the street.
        CN: 你穿过门厅，来到宽敞的起居室。高窗之外，花园一直延伸到将房子与街道隔开的围墙。
    - name: { EN: Upper floor, CN: 二层 }
      description:
        EN: A broad landing opens onto the private rooms. The garden is visible between the tall windows.
        CN: 宽敞的二层楼梯间通向私人房间。透过高窗，仍能看见花园。
    - name: { EN: Attic floor, CN: 阁楼 }
      description:
        EN: The last flight of stairs reaches a quiet room beneath the roof. A writing desk stands beside the dormer window.
        CN: 最后一段楼梯通往屋顶下安静的房间。一张书桌摆在老虎窗旁。
  rooms: { bedroom: 2, bathroom: 2, kitchen: 1, desk: 3, guest: 2, retreat: 1 }
  interior:
    bedroomLabel: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom has space to spare around the bed and wardrobe. Heavy curtains shelter it from the garden path.
      CN: 床与衣柜之间仍留着宽裕的空地。厚窗帘遮住了花园小径上的视线。
    bathroom:
      EN: A deep bath stands in the large bathroom. Warm water echoes against the stone floor and high ceiling.
      CN: 宽敞的浴室里有一只深浴缸。温水声在石地板与高天花板之间回荡。
    kitchenLabel: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The manor kitchen has a long worktop, a pantry and a dining table large enough for company. The chairs stand empty for now.
      CN: 宅邸的厨房有长操作台、储藏室，还有一张足以招待客人的餐桌。现在椅子仍空着。
    guest:
      EN: The guest bedroom is furnished with a bed, a wardrobe and a washstand. The broad window overlooks the garden.
      CN: 客房备着床、衣柜与洗漱台。宽阔的窗户俯瞰花园。
    retreatLabel: { EN: Conservatory (0:01), CN: 温室 (0:01) }
    retreat:
      EN: Glass doors open from the sitting room into a conservatory. Cane chairs stand among potted plants, overlooking the walled garden.
      CN: 玻璃门从起居室通向温室。藤椅摆在盆栽之间，望得见围墙里的花园。
    retreatRest:
      EN: You sit among the plants, with the garden on one side and the quiet house on the other.
      CN: 你坐在植物之间，一边是花园，另一边是安静的宅邸。
    renovated:
      EN: Restored woodwork and polished floors make the manor feel cared for again.
      CN: 修复过的木饰与擦亮的地板，让这座宅邸重新有了被悉心照料的样子。
