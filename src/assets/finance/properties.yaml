    bedroom_label: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom overlooks the water. A bed, desk and wardrobe stand well back from the salt-streaked window.
      CN: 卧室俯瞰海面。床、书桌和衣柜摆在窗后，离沾着盐痕的玻璃有些距离。
    bathroom:
      EN: The bathroom is warm despite the sea wind. You can hear the surf through the vent above the bath.
      CN: 海风吹不进温暖的浴室。泡澡时，你仍能从通风口听见潮声。
    kitchen_label: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The kitchen sits on the sheltered side of the house. A sturdy table, an oven and deep cupboards leave room to prepare food while the wind shakes the seaward windows.
      CN: 厨房位于房子背风的一侧。结实的餐桌、烤箱与深橱柜留出烹饪空间，海侧的窗户在风中作响。
    outdoor_label: { EN: Sea balcony (0:01), CN: 观海阳台 (0:01) }
    outdoor:
      EN: The upper balcony faces the water. Its stone wall keeps you back from the cliff edge, but it cannot keep out the salt wind. Nothing delicate would grow out here.
      CN: 二层阳台正对大海。石墙挡住了峭壁边缘，却挡不住带着盐味的海风。娇嫩的作物在这里长不起来。
    outdoor_view:
      EN: You follow a line of white foam until it breaks against the rocks below.
      CN: 你望着一道白色浪线，直到它撞上峭壁下的礁石。
    renovated:
      EN: Reinforced windows quiet the wind, leaving the view of the sea undisturbed.
      CN: 加固过的窗户挡住了风声，海景仍然清晰地展现在眼前。

