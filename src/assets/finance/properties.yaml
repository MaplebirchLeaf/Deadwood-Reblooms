      icon: heater.png
      floor: 1
      access: sitting
      cost: 800000
      upkeep: 1500
      name:
        EN: Pool heating
        CN: 泳池加热
      description:
        EN: A heater in the sheltered pump shed keeps the water usable through winter. It cannot make the deck safe in rain or snow.
        CN: 背风的水泵棚里装上了加热器，冬季的池水也能使用。下雨或下雪时，池边台阶仍不安全。
      requires: pool
    - id: garage
      icon: property/garage.png
      floor: 1
      access: sitting
      cost: 2000000
      upkeep: 500
      name:
        EN: Sheltered garage
        CN: 背风车库
      description:
        EN: A side door leads from the house to a single-car garage opening onto the street behind it. The recessed garage door keeps the worst salt spray off the lock.
        CN: 住宅的侧门通向单车位车库，车库门朝着屋后的街道。门藏在背风处，锁孔不至于直接挨盐雾吹。
