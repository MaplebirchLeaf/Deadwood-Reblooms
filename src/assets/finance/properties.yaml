# 金额单位是便士。floors 从入户层往上排列。rooms 指定功能房间所在的楼层（从 1 开始）。
# tenure: company 为协议住宿，费用另行结算，不进入房产交易。
# desk、guest 和 balcony 可以省略。outdoor 是各房产的庭院或阳台入口，仍按所在楼层配置。
# weekly_rent_percent 是各房产的每周挂牌租金率，状况与装修再参与实际租金计算。
# 床和衣柜的初始 ID 引用原版家具，其余家具由家具店目录选购。每处房产独立保存，不修改孤儿院卧室。
# resident_capacity 是除 PC 以外可同住的人数。普通住宅共用主卧，宅邸另有一间客房。
# 镜子坐标在每次进入触手平原时随机生成，房屋配置不保存出口坐标。不同出口可以落在同一格。
# outdoor_access 指出通向室外的实际房间。extensions.access 指定设施入口，inline 表示原空间内的小憩处。
- id: domus
  street: Domus Street
  outdoor_access: sitting
  mirror_label: { EN: Climb through the cottage mirror, CN: 从宅邸街小屋的镜子爬出去 }
  street_name:
    EN: Domus Street
    CN: 宅邸街
  price: 8000000
  weekly_rent_percent: 0.28
  resident_capacity: 0
  bed_id: singlebed
  wardrobe_id: wardrobe
  name:
    EN: Domus Street cottage
    CN: 宅邸街小屋
  entry_label:
    EN: Your cottage (0:02)
    CN: 你的小屋 (0:02)
  description:
    EN: A modest house with a narrow garden, close enough to see the orphanage from the street.
    CN: 这间朴素的小屋带着一方狭窄的庭院。从街上还能望见孤儿院。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: You step into a small sitting room. Light falls across the worn floorboards; beyond the window, the garden fence separates you from the street.
        CN: 你走进狭小的起居室。阳光落在磨旧的地板上。窗外的庭院围栏隔开了街上的目光。
  rooms: { bedroom: 1, bathroom: 1, kitchen: 1, outdoor: 1 }
  extensions:
    - id: lounge
      icon: couch.png
      floor: 1
      access: sitting
      inline: true
      cost: 0
      upkeep: 0
      name:
        EN: Window seat
        CN: 窗边小憩处
      description:
        EN: The old armchair fits between the garden window and the sleeping nook. You can put your feet up without blocking the kitchen.
        CN: 旧扶手椅挤在庭院窗与睡觉的角落之间。你能把脚搁起来，又不挡住去厨房的路。
    - id: study
      icon: property/study.png
      floor: 1
      access: sitting
      cost: 300000
      upkeep: 0
      name:
        EN: Foldaway study corner
        CN: 折叠学习角
      description:
        EN: A foldaway desk replaces the shallow cupboard beside the window. When the books are put away, the kitchen door still opens fully.
        CN: 窗边的浅柜换成了折叠书桌。把书收好、桌板放下，厨房门仍能完全打开。
    - id: garage
      icon: property/bicycle-shed.png
      floor: 1
      access: outdoor
      cost: 150000
      upkeep: 200
      name:
        EN: Garden bicycle shed
        CN: 庭院自行车棚
      description:
        EN: A narrow lockable shed stands against the garden wall. There is room for two bicycles and a shelf of tools; a car could never fit down the path.
        CN: 可上锁的窄棚紧贴庭院围墙，放得下两辆自行车和一架工具。门外的小径根本容不下汽车。
      parking: { bicycle: 2, motorcycle: 0, motor_vehicle: 0 }
  interior:
    bedroom_label: { EN: Sleeping nook (0:01), CN: 睡觉的角落 (0:01) }
    bedroom:
      EN: Your bed is tucked against the sitting room wall, with a narrow wardrobe beside it. There is no room for a full-sized desk; the orphanage roof is visible beyond the garden fence.
      CN: 床紧贴着起居室的墙，旁边仅摆得下一只窄衣柜。这里没有放大书桌的空地。越过庭院围栏还能看见孤儿院的屋顶。
    bathroom:
      EN: A narrow bath sits under the frosted window. The old pipes knock softly before the water warms.
      CN: 窄浴缸摆在磨砂窗下。水热起来之前，旧水管会轻轻敲响。
    kitchen_label: { EN: Kitchen corner (0:01), CN: 厨房角落 (0:01) }
    kitchen:
      EN: A single hob, a compact oven and a battered kettle occupy the end of the sitting room. The cupboard beneath them holds just enough for a few meals.
      CN: 起居室尽头的一小块台面放着单炉灶、小烤箱和旧水壶。下面的橱柜只装得下几顿饭的材料。
    outdoor_label: { EN: Garden (0:01), CN: 庭院 (0:01) }
    outdoor:
      EN: A low fence hems in the little garden. There is room for one narrow bed of soil beside the path, and no more. The orphanage roof rises beyond it.
      CN: 低矮的围栏圈出一小块庭院。小径旁只容得下一块窄苗圃，再多就种不下了。孤儿院的屋顶就在围栏外。
    outdoor_view:
      EN: You stand beside the fence and watch people pass on Domus Street. No one pays the small garden much attention.
      CN: 你站在围栏旁，看着宅邸街上的行人经过。没人留意这片小小的庭院。
    renovated:
      EN: Fresh paint covers the scuffed walls, and the repaired window closes without a draught.
      CN: 新漆盖住了墙上的磨痕，修好的窗户关上后也不再漏风。

