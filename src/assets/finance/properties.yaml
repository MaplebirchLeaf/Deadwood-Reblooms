        CN: 花园侧室内泳池
      description:
        EN: A door in the conservatory opens into the new wing containing the enclosed pool. High windows overlook the garden; warm pipes keep the water comfortable all year.
        CN: 温室旁的门通向新侧翼里的封闭泳池。高窗朝着花园，暖水管让池水一年四季都保持舒适。
      outdoor: false
  interior:
    bedroom_label: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom has space to spare around the bed and wardrobe. Heavy curtains shelter it from the garden path.
      CN: 床与衣柜之间仍留着宽裕的空地。厚窗帘遮住了花园小径上的视线。
    bathroom:
      EN: A deep bath stands in the large bathroom. Warm water echoes against the stone floor and high ceiling.
      CN: 宽敞的浴室里有一只深浴缸。温水声在石地板与高天花板之间回荡。
    kitchen_label: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The manor kitchen has a long worktop, an oven, a pantry and a dining table large enough for company. The chairs stand empty for now.
      CN: 宅邸的厨房有长操作台、烤箱、储藏室，还有一张足以招待客人的餐桌。现在椅子仍空着。
    outdoor_label: { EN: Garden terrace (0:01), CN: 花园露台 (0:01) }
    outdoor:
      EN: Stone steps lead from the conservatory to a terrace overlooking the walled garden. A path continues between its planted beds. The house hides the street from sight.
      CN: 石阶从温室通往花园露台。一条小径从露台边通向围墙内的苗圃。街道被宅邸挡在了身后。
    outdoor_view:
      EN: You walk to the edge of the terrace. The garden is quiet enough to hear leaves stir along the far wall.
      CN: 你走到露台边。花园很安静，远处围墙旁的树叶一动，声音也听得见。
    balcony_label: { EN: Upper balcony (0:01), CN: 二层阳台 (0:01) }
    balcony:
      EN: You step through the glass doors onto the upper balcony. The garden spreads below, enclosed by the manor walls. The street lies beyond them.
      CN: 你推开玻璃门，走上二层阳台。花园铺展在下方，被宅邸的围墙围住。街道在围墙另一头。
    balcony_view:
      EN: You lean against the rail. From here you can see the garden path winding between the planting beds and the conservatory roof below.
      CN: 你倚着栏杆。花园小径从苗圃间蜿蜒穿过，温室的屋顶就在下方。
    guest:
      EN: The guest bedroom is furnished with a bed, a wardrobe and a washstand. The broad window overlooks the garden.
      CN: 客房备着床、衣柜与洗漱台。宽阔的窗户俯瞰花园。
    renovated:
      EN: Restored woodwork and polished floors make the manor feel cared for again.
      CN: 修复过的木饰与擦亮的地板，让这座宅邸重新有了被悉心照料的样子。
- id: penthouse
  tenure: company
