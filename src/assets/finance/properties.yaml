        EN: A door beside the kitchen leads onto the pool deck. A low wall separates the open-air pool from the cliff edge. Waves break far below the tiled deck. Rain and snow make the uncovered steps unsafe.
        CN: 厨房旁的门通向池边平台。矮墙将露天泳池与崖缘隔开，海浪在瓷砖平台下方很远的地方碎开。雨雪天，没有遮蔽的台阶会变得湿滑。
