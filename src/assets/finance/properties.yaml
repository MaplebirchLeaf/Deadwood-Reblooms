      cost: 0
      upkeep: 0
      name:
        EN: Attic study
        CN: 阁楼书房
      description:
        EN: The dormer window lights a broad writing desk. Shelves fill the low walls; the floors below are quiet behind a closed door.
        CN: 老虎窗照亮了宽书桌，矮墙边摆满书架。门一关，下方楼层的声音便远了。
    - id: garage
