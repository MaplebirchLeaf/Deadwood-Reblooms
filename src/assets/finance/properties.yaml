    - name: { EN: Upper floor, CN: 二层 }
      description:
        EN: The stairs rise towards a sea-facing window. The landing is quiet except for the wind beyond the glass.
        CN: 楼梯向一扇朝海的窗户延伸。除了玻璃外的风声，二层楼梯间一片安静。
  rooms: { bedroom: 2, bathroom: 1, kitchen: 1, desk: 2, outdoor: 2 }
  extensions:
    - id: lounge
      icon: couch.png
      floor: 2
      access: landing
      cost: 0
      upkeep: 0
      name:
        EN: Sea-view alcove
        CN: 观海角
      description:
        EN: A broad chair faces the sea through a sheltered window. A folded blanket waits on its arm; the glass door leads onto the balcony.
        CN: 避风的窗前摆着宽椅，正对大海。扶手上叠着厚毯，旁边的玻璃门通向阳台。
    - id: study
      icon: property/study.png
      floor: 2
      access: bedroom
      cost: 1200000
      upkeep: 300
      name:
        EN: Sea-view study
        CN: 观海书房
      description:
        EN: Salt-resistant shutters frame a long desk. You can look up from your books to watch the waves without feeling the wind on your fingers.
        CN: 耐盐的百叶窗围着长书桌。你抬头便能看见海浪，手指却不用挨海风吹。
    - id: pool
      icon: property/pool-outdoor.png
      floor: 1
      access: sitting
      cost: 5000000
      upkeep: 3000
      name:
        EN: Cliffside pool
        CN: 崖边泳池
