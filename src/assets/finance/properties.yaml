      name:
        EN: Manor garage
        CN: 宅邸车库
      description:
        EN: A side door off the entrance hall leads to the gravel drive inside the gate and the two parking bays. Along the back wall, hooks and a rack leave bicycles clear of the doors.
        CN: 门厅旁的侧门通向大门内的碎石车道与两个车位。后墙上的挂钩与车架给自行车留了地方，不会挡住车库门。
