# 金额单位是便士。floors 从入户层往上排列。rooms 指定功能房间所在的楼层（从 1 开始）。
# desk、guest 和 retreat 可以省略。outdoor 是各房产的庭院或阳台入口，仍按所在楼层配置。
# weekly_rent_percent 是各房产的每周挂牌租金率，状况与装修再参与实际租金计算。
# 床和衣柜的初始 ID 引用原版家具，其余家具由家具店目录选购。每处房产独立保存，不修改孤儿院卧室。
# resident_capacity 是除 PC 以外可同住的人数。普通住宅共用主卧，宅邸另有一间客房。
# 镜子坐标在每次进入触手平原时随机生成，房屋配置不保存出口坐标。不同出口可以落在同一格。
# outdoor_access 指出通向室外的实际房间。sitting 为起居室，landing 为楼梯间，retreat 为休憩室。
- id: domus
  street: Domus Street
  outdoor_access: sitting
  mirror_label: { EN: Climb through the cottage mirror, CN: 从宅邸街小屋的镜子爬出去 }
  street_name:
    EN: Domus Street
    CN: 宅邸街
  price: 8000000
  weekly_rent_percent: 0.49
  resident_capacity: 0
  bed_id: singlebed
  wardrobe_id: wardrobe
  name:
    EN: Domus Street cottage
    CN: 宅邸街小屋
  entry_label:
    EN: Your cottage (0:02)
    CN: 你的小屋 (0:02)
  description:
    EN: A modest house with a narrow garden, close enough to see the orphanage from the street.
    CN: 这间朴素的小屋带着一方狭窄的庭院。从街上还能望见孤儿院。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: You step into a small sitting room. Light falls across the worn floorboards; beyond the window, the garden fence separates you from the street.
        CN: 你走进狭小的起居室。阳光落在磨旧的地板上。窗外的庭院围栏隔开了街上的目光。
  rooms: { bedroom: 1, bathroom: 1, kitchen: 1, outdoor: 1 }
  interior:
    bedroom_label: { EN: Sleeping nook (0:01), CN: 睡觉的角落 (0:01) }
    bedroom:
      EN: Your bed is tucked against the sitting room wall, with a narrow wardrobe beside it. There is no room for a proper desk; the orphanage roof is visible beyond the garden fence.
      CN: 床紧贴着起居室的墙，旁边仅摆得下一只窄衣柜。这里没有放书桌的空地。越过庭院围栏还能看见孤儿院的屋顶。
    sitting_rest:
      EN: You settle into the old chair beside the garden window. The orphanage roof catches your eye as the noise of the street fades.
      CN: 你坐进庭院窗边的旧椅子。街上的声音渐渐远了，你的目光停在孤儿院的屋顶上。
    bathroom:
      EN: A narrow bath sits under the frosted window. The old pipes knock softly before the water warms.
      CN: 窄浴缸摆在磨砂窗下。水热起来之前，旧水管会轻轻敲响。
    kitchen_label: { EN: Kitchen corner (0:01), CN: 厨房角落 (0:01) }
    kitchen:
      EN: A single hob, a compact oven and a battered kettle occupy the end of the sitting room. The cupboard beneath them holds just enough for a few meals.
      CN: 起居室尽头的一小块台面放着单炉灶、小烤箱和旧水壶。下面的橱柜只装得下几顿饭的材料。
    outdoor_label: { EN: Garden (0:01), CN: 庭院 (0:01) }
    outdoor:
      EN: A low fence hems in the little garden. There is room for one narrow bed of soil beside the path, and no more. The orphanage roof rises beyond it.
      CN: 低矮的围栏圈出一小块庭院。小径旁只容得下一块窄苗圃，再多就种不下了。孤儿院的屋顶就在围栏外。
    outdoor_view:
      EN: You stand beside the fence and watch people pass on Domus Street. No one pays the small garden much attention.
      CN: 你站在围栏旁，看着宅邸街上的行人经过。没人留意这片小小的庭院。
    renovated:
      EN: Fresh paint covers the scuffed walls, and the repaired window closes without a draught.
      CN: 新漆盖住了墙上的磨痕，修好的窗户关上后也不再漏风。

- id: barb
  street: Barb Street
  outdoor_access: sitting
  mirror_label: { EN: Climb through the flat mirror, CN: 从倒钩街公寓的镜子爬出去 }
  street_name:
    EN: Barb Street
    CN: 倒钩街
  price: 15000000
  weekly_rent_percent: 0.525
  resident_capacity: 1
  bed_id: singlebed
  wardrobe_id: wardrobebasic
  name:
    EN: Barb Street flat
    CN: 倒钩街公寓
  entry_label:
    EN: Your flat (0:02)
    CN: 你的公寓 (0:02)
  description:
    EN: A clean flat above the dried canal. Traffic hums beyond the window.
    CN: 干涸运河旁的公寓整洁明亮。窗外隐隐传来车流声。
  floors:
    - name: { EN: Flat, CN: 公寓 }
      description:
        EN: You climb the stairs to your flat. The sitting room looks out over the empty canal, while traffic rolls past on the far bank.
        CN: 你爬上楼梯，走进自己的公寓。起居室朝着干涸的运河，车流从对岸驶过。
  rooms: { bedroom: 1, bathroom: 1, kitchen: 1, desk: 1, outdoor: 1 }
  interior:
    bedroom_label: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom door muffles the road noise. A desk fits beneath the window, with the wardrobe against the opposite wall.
      CN: 卧室的门挡住了道路的喧闹。书桌安在窗下，衣柜靠着对面的墙。
    sitting_rest:
      EN: You settle into the cushioned window seat. Traffic rolls past the canal, muffled by the closed glass.
      CN: 你坐进窗边的软垫座位。车流经过运河，声音被关着的玻璃隔得模糊。
    bathroom:
      EN: White tiles line the compact bathroom. Running water drowns out the traffic outside.
      CN: 紧凑的浴室铺着白瓷砖。水声盖过了外面的车流声。
    kitchen_label: { EN: Kitchenette (0:01), CN: 小厨房 (0:01) }
    kitchen:
      EN: A small counter divides the kitchenette from the sitting room. A kettle, two burners, a small oven and a narrow cupboard fit along the wall.
      CN: 一段矮柜把小厨房与起居室隔开。水壶、双炉灶、小烤箱和窄橱柜沿墙排开。
    outdoor_label: { EN: Balcony (0:01), CN: 阳台 (0:01) }
    outdoor:
      EN: The balcony is hardly wider than the doorway. There is room to stand by the metal railing, but not for a planting bed. The dry canal and road lie below.
      CN: 阳台只比门口宽出一点。你可以靠着金属栏杆站一会儿，却摆不下一块苗圃。下面是干涸的运河，再远些便是马路。
    outdoor_view:
      EN: A car crosses the canal bridge. Its sound fades before the next one appears.
      CN: 一辆车驶过运河桥。引擎声渐渐远去，下一辆车还没有出现。
    renovated:
      EN: New fittings brighten the flat, and the sealed windows keep the canal air outside.
      CN: 新装的家具让公寓明亮起来，密封好的窗户把运河边的风挡在外面。

- id: high
  street: High Street
  outdoor_access: landing
  mirror_label: { EN: Climb through the loft mirror, CN: 从商业街楼上住宅的镜子爬出去 }
  street_name:
    EN: High Street
    CN: 商业街
  price: 25000000
  weekly_rent_percent: 0.56
  resident_capacity: 1
  bed_id: doublebed
  wardrobe_id: wardrobebasic
  name:
    EN: High Street loft
    CN: 商业街楼上住宅
  entry_label:
    EN: Your loft (0:02)
    CN: 你的阁楼 (0:02)
  description:
    EN: A private loft over the shops, with the bustle of the market below.
    CN: 店铺楼上的私人住所。楼下的商业街终日热闹。
  floors:
    - name: { EN: Lower loft, CN: 阁楼下层 }
      description:
        EN: You shut the loft door behind you. Shop signs glow below the sitting room windows, and voices drift up from the pavement.
        CN: 你关上阁楼的门。店铺招牌的灯光映在起居室窗上，人声从楼下的人行道飘上来。
    - name: { EN: Upper loft, CN: 阁楼上层 }
      description:
        EN: A short staircase leads to the quieter upper level. The sloping roof leaves room for a bedroom and a writing desk.
        CN: 一段短楼梯通向较为安静的上层。倾斜的屋顶下留着卧室与书桌的位置。
  rooms: { bedroom: 2, bathroom: 1, kitchen: 1, desk: 2, retreat: 2, outdoor: 2 }
  interior:
    bedroom_label: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: A partition separates the bed from the rest of the loft. The wardrobe and desk sit beneath the sloping roof.
      CN: 一道隔板把床与阁楼的其余空间分开。衣柜和书桌摆在倾斜的屋顶下。
    bathroom:
      EN: The tiled bathroom is tucked behind the stairs. Steam fogs its small skylight when the bath fills.
      CN: 铺瓷砖的浴室藏在楼梯后面。浴缸放满水时，蒸汽会蒙住小小的天窗。
    kitchen_label: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The kitchen occupies a separate room beside the lower loft. An oven stands beneath its broad counter, where the last light from the shop windows falls.
      CN: 厨房是阁楼下层旁边的独立房间。宽阔的台面下嵌着烤箱，店铺窗外最后一抹光落在上面。
    outdoor_label: { EN: Roof terrace (0:01), CN: 屋顶露台 (0:01) }
    outdoor:
      EN: A narrow roof terrace sits above the shops. One shallow timber planter rests against the sheltered wall. Shop signs glow below the parapet, and the market can be heard from here.
      CN: 店铺上方有一方狭长的屋顶露台。背风的墙边只摆得下一只浅木种植箱。女儿墙下亮着招牌，市场的声音也传得上来。
    outdoor_view:
      EN: From above, the shoppers seem to move together in little streams. A stallholder calls out a final price.
      CN: 从高处看，逛街的人群像一股股细流。一名摊主喊出了收摊前的价格。
    retreat_label: { EN: Reading alcove (0:01), CN: 阅读角 (0:01) }
    retreat:
      EN: A low bookcase and an armchair sit beneath the upper roof window. The shopkeepers' voices are only a murmur from up here.
      CN: 矮书柜与扶手椅摆在上层的天窗下。从这里听去，店铺里的人声只剩模糊的低语。
    retreat_rest:
      EN: You settle into the armchair and let the noises of the market fade.
      CN: 你陷进扶手椅里，任由市场的喧闹渐渐远去。
    renovated:
      EN: Thick curtains and a new partition give you a little quiet above the busy shops.
      CN: 厚窗帘和新隔板让你在热闹的店铺上方也能有片刻安静。

- id: cliff
  street: Cliff Street
  outdoor_access: retreat
  mirror_label: { EN: Climb through the cliffside mirror, CN: 从峭壁街住宅的镜子爬出去 }
  street_name:
    EN: Cliff Street
    CN: 峭壁街
  price: 40000000
  weekly_rent_percent: 0.455
  resident_capacity: 1
  bed_id: doublebeddeluxe
  wardrobe_id: wardrobebasic
  name:
    EN: Cliff Street sea-view house
    CN: 峭壁街海景住宅
  entry_label:
    EN: Your sea-view house (0:02)
    CN: 你的海景住宅 (0:02)
  description:
    EN: A quiet house facing the sea. Salt air reaches even the bedroom.
    CN: 安静的房子面朝大海。连卧室里也能闻到海风的咸味。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: The sitting room faces the sea. Waves break below the cliff, and the windows rattle whenever the wind rises.
        CN: 起居室面朝大海。浪花在峭壁下碎开。风一起，窗户便轻轻作响。
    - name: { EN: Upper floor, CN: 二层 }
      description:
        EN: The stairs rise towards a sea-facing window. The landing is quiet except for the wind beyond the glass.
        CN: 楼梯向一扇朝海的窗户延伸。除了玻璃外的风声，二层楼梯间一片安静。
  rooms: { bedroom: 2, bathroom: 1, kitchen: 1, desk: 2, retreat: 2, outdoor: 2 }
  interior:
    bedroom_label: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom overlooks the water. A bed, desk and wardrobe stand well back from the salt-streaked window.
      CN: 卧室俯瞰海面。床、书桌和衣柜摆在窗后，离沾着盐痕的玻璃有些距离。
    bathroom:
      EN: The bathroom is warm despite the sea wind. You can hear the surf through the vent above the bath.
      CN: 海风吹不进温暖的浴室。泡澡时，你仍能从通风口听见潮声。
    kitchen_label: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The kitchen sits on the sheltered side of the house. A sturdy table, an oven and deep cupboards leave room to prepare food while the wind shakes the seaward windows.
      CN: 厨房位于房子背风的一侧。结实的餐桌、烤箱与深橱柜留出烹饪空间，海侧的窗户在风中作响。
    outdoor_label: { EN: Sea balcony (0:01), CN: 观海阳台 (0:01) }
    outdoor:
      EN: The upper balcony faces the water. Its stone wall keeps you back from the cliff edge, but it cannot keep out the salt wind. Nothing delicate would grow out here.
      CN: 二层阳台正对大海。石墙挡住了峭壁边缘，却挡不住带着盐味的海风。娇嫩的作物在这里长不起来。
    outdoor_view:
      EN: You follow a line of white foam until it breaks against the rocks below.
      CN: 你望着一道白色浪线，直到它撞上峭壁下的礁石。
    retreat_label: { EN: Sea-view alcove (0:01), CN: 观海角 (0:01) }
    retreat:
      EN: A broad chair faces the sea through a sheltered upper window. A thick blanket lies folded over its arm. A glass door opens onto the sea balcony.
      CN: 二层一扇避风的窗前摆着宽椅，正对大海。扶手上叠着一条厚毯。旁边的玻璃门通向观海阳台。
    retreat_rest:
      EN: You draw the blanket over your knees and listen to the waves below.
      CN: 你把毯子盖在膝上，听着下方的浪声。
    renovated:
      EN: Reinforced windows quiet the wind, leaving the view of the sea undisturbed.
      CN: 加固过的窗户挡住了风声，海景仍然清晰地展现在眼前。

- id: danube
  street: Danube Street
  outdoor_access: retreat
  mirror_label: { EN: Climb through the mansion mirror, CN: 从多瑙河街宅邸的镜子爬出去 }
  street_name:
    EN: Danube Street
    CN: 多瑙河街
  price: 60000000
  weekly_rent_percent: 0.385
  resident_capacity: 2
  bed_id: doublebedexotic
  wardrobe_id: armoire
  name:
    EN: Danube Street manor
    CN: 多瑙河街宅邸
  entry_label:
    EN: Your manor (0:02)
    CN: 你的宅邸 (0:02)
  description:
    EN: A secluded manor behind high walls and a sweeping garden.
    CN: 高墙与宽阔花园围起的宅邸，街上的目光被留在门外。
  floors:
    - name: { EN: Ground floor, CN: 一层 }
      description:
        EN: You cross the entrance hall into a broad sitting room. Beyond the tall windows, the garden stretches to the walls that hide the house from the street.
        CN: 你穿过门厅，来到宽敞的起居室。高窗之外，花园一直延伸到将房子与街道隔开的围墙。
    - name: { EN: Upper floor, CN: 二层 }
      description:
        EN: A broad landing opens onto the private rooms. The garden is visible between the tall windows.
        CN: 宽敞的二层楼梯间通向私人房间。透过高窗，仍能看见花园。
    - name: { EN: Attic floor, CN: 阁楼 }
      description:
        EN: The last flight of stairs reaches a quiet room beneath the roof. A writing desk stands beside the dormer window.
        CN: 最后一段楼梯通往屋顶下安静的房间。一张书桌摆在老虎窗旁。
  rooms: { bedroom: 2, bathroom: 2, kitchen: 1, desk: 3, guest: 2, retreat: 1, outdoor: 1, balcony: 2 }
  interior:
    bedroom_label: { EN: Bedroom (0:01), CN: 卧室 (0:01) }
    bedroom:
      EN: The bedroom has space to spare around the bed and wardrobe. Heavy curtains shelter it from the garden path.
      CN: 床与衣柜之间仍留着宽裕的空地。厚窗帘遮住了花园小径上的视线。
    bathroom:
      EN: A deep bath stands in the large bathroom. Warm water echoes against the stone floor and high ceiling.
      CN: 宽敞的浴室里有一只深浴缸。温水声在石地板与高天花板之间回荡。
    kitchen_label: { EN: Kitchen (0:01), CN: 厨房 (0:01) }
    kitchen:
      EN: The manor kitchen has a long worktop, an oven, a pantry and a dining table large enough for company. The chairs stand empty for now.
      CN: 宅邸的厨房有长操作台、烤箱、储藏室，还有一张足以招待客人的餐桌。现在椅子仍空着。
    outdoor_label: { EN: Garden terrace (0:01), CN: 花园露台 (0:01) }
    outdoor:
      EN: Stone steps lead from the conservatory to a terrace overlooking the walled garden. A path continues between its planted beds. The house hides the street from sight.
      CN: 石阶从温室通往花园露台。一条小径从露台边通向围墙内的苗圃。街道被宅邸挡在了身后。
    outdoor_view:
      EN: You walk to the edge of the terrace. The garden is quiet enough to hear leaves stir along the far wall.
      CN: 你走到露台边。花园很安静，远处围墙旁的树叶一动，声音也听得见。
    balcony_label: { EN: Upper balcony (0:01), CN: 二层阳台 (0:01) }
    balcony:
      EN: You step through the glass doors onto the upper balcony. The garden spreads below, enclosed by the manor walls. The street lies beyond them.
      CN: 你推开玻璃门，走上二层阳台。花园铺展在下方，被宅邸的围墙围住。街道在围墙另一头。
    balcony_view:
      EN: You lean against the rail. From here you can see the garden path winding between the planting beds and the conservatory roof below.
      CN: 你倚着栏杆。花园小径从苗圃间蜿蜒穿过，温室的屋顶就在下方。
    guest:
      EN: The guest bedroom is furnished with a bed, a wardrobe and a washstand. The broad window overlooks the garden.
      CN: 客房备着床、衣柜与洗漱台。宽阔的窗户俯瞰花园。
    retreat_label: { EN: Conservatory (0:01), CN: 温室 (0:01) }
    retreat:
      EN: Glass doors open from the sitting room into a conservatory. Cane chairs stand among potted plants, overlooking the walled garden.
      CN: 玻璃门从起居室通向温室。藤椅摆在盆栽之间，望得见围墙里的花园。
    retreat_rest:
      EN: You sit among the plants, with the garden on one side and the quiet house on the other.
      CN: 你坐在植物之间，一边是花园，另一边是安静的宅邸。
    renovated:
      EN: Restored woodwork and polished floors make the manor feel cared for again.
      CN: 修复过的木饰与擦亮的地板，让这座宅邸重新有了被悉心照料的样子。
