'deadwood-reblooms.combat.hooves.kick.2': 你的蹄足破空而至，迸发出骇人的力量。
'deadwood-reblooms.combat.hooves.kick.3': 你以蹄足发起重击，震得对手猝不及防。
'deadwood-reblooms.Traits.sweatblood.name': 汗血
'deadwood-reblooms.Traits.sweatblood.text': 温度对你的影响降低。
'deadwood-reblooms.Traits.horse.text': 你产生了奔跑的冲动。你的疲劳积累得更慢。你的耳朵和尾巴让你更加显眼。
