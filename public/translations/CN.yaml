'deadwood-reblooms.LongerCombat.npc.named.Black Wolf.f.forced.early.1': 你的气味乱了。慢点……再插。
'deadwood-reblooms.LongerCombat.npc.named.Black Wolf.f.forced.middle.0': 话太多。听不清……用力。
'deadwood-reblooms.LongerCombat.npc.named.Black Wolf.f.forced.middle.1': 不听。又说一遍……再深。
