# Alex — f
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.consensual.early.0': 难得闲下来，别弄得比干活还忙……继续操。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.consensual.early.1': 总得给自己留点好时候……再深一点。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.consensual.middle.0': 这可不是赶工，犯不着逞强……再用力。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.consensual.middle.1': 干活都知道歇口气，咱们也一样……先把我干到喷。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.consensual.late.0': 再好的体力也得歇歇……再射一次。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.consensual.late.1': 歇够了才有力气，别急……先填满我。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.forced.early.0': 咱们把话摊开说……继续干。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.forced.early.1': 别拿我当听不懂话的人……再插。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.forced.middle.0': 别总把同一句话推回来……用力。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.forced.middle.1': 我现在可没心思拐弯抹角……再深。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.forced.late.0': 累归累，该说的我还得说……再来。
'deadwood-reblooms.LongerCombat.npc.named.Alex.f.forced.late.1': 先歇口气，别忙着争……射进来。
