'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.consensual.late.1': 歌可以等。你也要射进来。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.forced.early.0': 不要背过身。听着……继续干。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.forced.early.1': 别急着离开。话还没完……再插。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.forced.middle.0': 一直说，一直不听……用力。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.forced.middle.1': 看这里。不是那边……再深。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.forced.late.0': 翅膀累了。等一会儿……再来。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.forced.late.1': 声音也累了。先安静……射进来。
