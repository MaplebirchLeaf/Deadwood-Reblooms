'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.consensual.middle.0': 我没有走神，我只是在想怎么把你操得更狠。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.consensual.middle.1': 你不会觉得我插得太深吧？
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.consensual.late.0': 我很累，可是不想错过射进你里面的感觉。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.consensual.late.1': 我、我还想听见你被我操的声音。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.forced.early.0': 你为什么一直不看我操你的样子？
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.forced.early.1': 别提其他人，我想把我们的事操清楚。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.forced.middle.0': 我记得刚才每一次顶到你最里面。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.forced.middle.1': 我没有忘记……你也没有，对吧？再来一次。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.forced.late.0': 我只是太累了，不是忘了操你的感觉。
'deadwood-reblooms.LongerCombat.npc.named.Kylar.m.forced.late.1': 别让我猜你的意思……直接让我射进来。
# Whitney — f
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.consensual.early.0': 哼，还挺喜欢操我？
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.consensual.early.1': 别笑得那么得意，我看见你又硬了。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.consensual.middle.0': 我才没有累，少用那种眼神看我……继续插。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.consensual.middle.1': 行了，不用什么都往脸上写……再深一点。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.consensual.late.0': 别笑，我只是被你操到腿软。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.consensual.late.1': 今天这些，少拿出去炫耀……再射一次。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.forced.early.0': 少给我装没听见……继续干。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.forced.early.1': 啧，你看什么？把我操到喷水。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.forced.middle.0': 别用那种眼神激我……再用力一点。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.forced.middle.1': 我讨厌把话说第二遍……直接插到底。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.forced.late.0': 别得意，我只是喘口气……继续操。
'deadwood-reblooms.LongerCombat.npc.named.Whitney.f.forced.late.1': 闭上嘴，先把我干到失禁。
