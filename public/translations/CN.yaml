# Great Hawk — f
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.consensual.early.0': 没有你的声音，太安静……继续操。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.consensual.early.1': 以后一起飞，现在先把我填满。
'deadwood-reblooms.LongerCombat.npc.named.Great Hawk.f.consensual.middle.0': 声音轻了。累了？再深一点。
