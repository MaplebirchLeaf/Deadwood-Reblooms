# Gwylan — f
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.consensual.early.0': 你看起来有许多话想说……用身体说吧。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.consensual.early.1': 不用急着回答，想好了再把我操开。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.consensual.middle.0': 有时候，安静比急着开口更有用……继续插。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.consensual.middle.1': 人总不能忘了照顾自己……再深一点。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.consensual.late.0': 连森林也需要休养……再射一次。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.consensual.late.1': 有些事，养足精神再谈也不迟……先把我填满。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.forced.early.0': 别急着替我下结论……继续干我。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.forced.early.1': 我听着，但你也该用身体听我说。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.forced.middle.0': 执意不听，事情不会变得更明白……再插深。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.forced.middle.1': 你似乎把我的耐心当成了别的东西……继续操。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.forced.late.0': 我需要恢复精神，意思并没有改变……再来一次。
'deadwood-reblooms.LongerCombat.npc.named.Gwylan.f.forced.late.1': 我们先留一点安静给彼此……用精液填满我。
