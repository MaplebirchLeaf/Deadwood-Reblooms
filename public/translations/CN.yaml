'deadwood-reblooms.LongerCombat.npc.named.Alex.m.forced.middle.1': 我现在可没心思拐弯抹角……再深。
'deadwood-reblooms.LongerCombat.npc.named.Alex.m.forced.late.0': 累归累，该说的我还得说……再来。
'deadwood-reblooms.LongerCombat.npc.named.Alex.m.forced.late.1': 先歇口气，别忙着争……射进来。
# Avery — f
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.consensual.early.0': 其他安排可以稍后再谈……先把我操开。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.consensual.early.1': 既然有时间，就不必仓促……再深一点。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.consensual.middle.0': 我想我们可以调整一下安排……继续插。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.consensual.middle.1': 不必为了表现而勉强自己……再用力。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.consensual.late.0': 我承认，该留出休息时间了……再射一次。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.consensual.late.1': 有些安排，现在推迟更合适……先把我填满。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.forced.early.0': 我希望自己的意思足够清楚……继续干。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.forced.early.1': 这不是可以敷衍过去的事情……再插。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.forced.middle.0': 我不喜欢无谓地浪费时间……用力。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.forced.middle.1': 别把我的克制当作默认……再深。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.forced.late.0': 我需要休息，不代表事情已经解决……再来。
'deadwood-reblooms.LongerCombat.npc.named.Avery.f.forced.late.1': 请给我一点时间整理思绪……射进来。
