# 日蚀
'deadwood-reblooms.SolarEclipse.clear.default.0': 太阳边缘被阴影咬开一道缺口，明亮的白昼微微发暗，天空浮起一层淡淡的黄雾。
'deadwood-reblooms.SolarEclipse.clear.default.1': 阴影继续向太阳中心推进，街道上的色彩逐渐褪淡，远处的轮廓像被灰尘轻轻盖住。
'deadwood-reblooms.SolarEclipse.clear.default.2': 日光明显衰弱，晴空泛出暗金色，四周的声音似乎也被压低了一些。
'deadwood-reblooms.SolarEclipse.clear.default.3': 太阳几乎完全沉入阴影，短暂的白昼变得昏暗，只剩一圈冷淡的金色光晕悬在天上。
'deadwood-reblooms.SolarEclipse.clear.default.4': 阴影开始从太阳中心移开，光线缓慢回升，但天空仍残留着不自然的暗黄色。
'deadwood-reblooms.SolarEclipse.clear.default.5': 太阳重新露出大半，街道逐渐恢复亮度，屋檐和云边还沾着一层淡淡的昏黄。
'deadwood-reblooms.SolarEclipse.clear.default.6': 最后一缕阴影从太阳边缘退去，天空慢慢恢复正常，只留下片刻怪异的余光。

'deadwood-reblooms.SolarEclipse.lightClouds.default.0': 薄云从太阳前方掠过，云缘先染上一点浅黄，像天空提前露出了异样的征兆。
'deadwood-reblooms.SolarEclipse.lightClouds.default.1': 太阳缺口逐渐扩大，云层边缘暗了下来，透过云隙的光不再清澈。
'deadwood-reblooms.SolarEclipse.lightClouds.default.2': 薄云在昏黄天幕下缓慢移动，云影比平时更深，空气也显得沉了几分。
'deadwood-reblooms.SolarEclipse.lightClouds.default.3': 最深的阴影压进云层，天空像旧纸一样暗下去，只在边缘透出一圈暗金色。
'deadwood-reblooms.SolarEclipse.lightClouds.default.4': 太阳的亮度开始恢复，困在云中的黄灰色逐渐松散，却还没有完全散开。
'deadwood-reblooms.SolarEclipse.lightClouds.default.5': 云朵慢慢恢复浅白，只有被阳光穿过的地方仍带着一点灰黄的边。
'deadwood-reblooms.SolarEclipse.lightClouds.default.6': 天空重新变亮，薄云恢复轻淡，几缕异色云痕也渐渐散去。

'deadwood-reblooms.SolarEclipse.heavyClouds.default.0': 厚云下的天色忽然压低，太阳的缺口被云幕遮住，只剩一片模糊的暗黄从后方渗出。
'deadwood-reblooms.SolarEclipse.heavyClouds.default.1': 云底泛起灰黄色，像暴雨前的阴影又沉了一层，街道也随之暗了下来。
'deadwood-reblooms.SolarEclipse.heavyClouds.default.2': 浓云遮住天空，异常的暗光从云后扩散，把四周压成沉闷的黄灰色。
'deadwood-reblooms.SolarEclipse.heavyClouds.default.3': 最深的黑影藏在厚云之后，天空几乎失去方向，只剩低垂而沉重的云幕。
'deadwood-reblooms.SolarEclipse.heavyClouds.default.4': 太阳从阴影中缓慢恢复，厚云后方透出迟钝的亮光，昏黄开始变薄。
'deadwood-reblooms.SolarEclipse.heavyClouds.default.5': 云层依旧沉重，但地面重新有了光，远处的轮廓逐渐清晰。
'deadwood-reblooms.SolarEclipse.heavyClouds.default.6': 厚云恢复原本的阴沉，天空里那层异常的黄灰色慢慢退去。

'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.0': 稀疏的雨雪落进逐渐变暗的光里，潮湿的空气泛起一层浅浅的黄灰色。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.1': 天色继续下沉，细密的水汽模糊了远处的轮廓，也让街道显得更冷清。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.2': 昏黄的天空压在潮湿空气上，墙面和路面都比平时暗了几分。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.3': 四周短暂失去白昼感，只剩轻微的落水声和一片暗金色的天光。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.4': 光线开始回升，空气中的暗色逐渐变薄，潮湿的地面重新映出天空。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.5': 街道恢复了些许亮度，角落里仍残留一点黄灰色的湿冷光泽。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.default.6': 天色回到平常，只剩潮湿空气和短暂阴冷留在身边。

'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.0': 细雨落进变暗的日光里，雨丝隐约带着浅浅的黄灰色。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.1': 太阳被遮去更多，雨幕显得更密，地面的水痕反出暗淡的金色。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.2': 昏黄的天空压在细雨上，每一处积水都像蒙着一层旧铜色的光。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.3': 雨声变得格外清晰，街道在暗金色雨幕中短暂失去白昼感。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.4': 太阳开始恢复，雨中的暗色慢慢变薄，水面重新映出较亮的天空。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.5': 细雨仍在落下，但光线已经回升，只剩水痕里残留一点黄灰。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.rain.6': 雨色恢复平常，空气中只剩潮湿和短暂的阴冷。

'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.0': 雪花穿过变暗的日光，边缘沾上一点淡淡的黄色。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.1': 太阳缺口扩大，雪色不再干净，飘落时混着灰白和浅金。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.2': 昏黄天色让雪片显得迟缓，地面积雪反出冷淡的黄白光。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.3': 雪地失去明亮感，天地之间只剩一片暗淡的乳黄色。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.4': 光线开始恢复，雪面上的暗黄逐渐变浅，但阴影处仍显得浑浊。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.5': 雪花重新接近白色，屋顶和路边的积雪慢慢恢复清亮。
'deadwood-reblooms.SolarEclipse.lightPrecipitation.snow.6': 雪色基本恢复，只剩少量灰黄余光留在背阴处。

'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.0': 沉重的雨雪压进逐渐变暗的街道，天空像被拉成一片模糊的黄影。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.1': 天色继续下沉，远处建筑迅速隐入暗黄色的水汽之中。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.2': 天空像被水汽和阴影一起压低，街面不时闪出暗金色的反光。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.3': 远处轮廓被完全吞没，四周只剩沉重的声响和昏暗的天光。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.4': 太阳开始脱离阴影，空气中的暗黄色逐渐变稀，远处也重新有了层次。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.5': 天气仍未缓和，但街道已经从最深的昏暗中恢复过来。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.default.6': 天色回到普通的灰暗，积水或积雪上的异常反光慢慢消失。

'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.0': 大雨砸在逐渐变暗的街道上，雨幕把太阳的缺口晕成一片模糊的黄影。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.1': 雨势加深了天空的昏暗，远处建筑迅速隐入暗黄色的水汽中。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.2': 天空像被雨水和阴影一起压低，街面水流反复闪出暗金色。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.3': 暴雨吞没远处轮廓，四周只剩雨声和沉重的昏光。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.4': 太阳开始脱离阴影，雨幕中的暗黄色逐渐变稀，水流也重新有了亮度。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.5': 大雨仍未完全停下，但街道已经从最深的昏暗中恢复。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.rain.6': 雨幕回到普通的灰色，积水里的异常反光慢慢消失。

'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.0': 风雪卷过变暗的天空，飞雪外缘被染上一层淡黄。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.1': 太阳继续被遮住，暴雪中的轮廓迅速模糊，天地间只剩灰白和暗金。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.2': 异常的昏光混入风雪，方向感变得迟钝，远处几乎完全看不清。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.3': 天空和地面搅成一片沉重的黄白色，风雪像是压在身边。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.4': 太阳开始恢复，风雪中的暗黄逐渐退开，远处轮廓重新浮现。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.5': 雪势仍强，但亮度回来了，飞雪不再像刚才那样浑浊。
'deadwood-reblooms.SolarEclipse.heavyPrecipitation.snow.6': 暴雪恢复普通的苍白，积雪上的异色也慢慢散去。

'deadwood-reblooms.SolarEclipse.thunderstorm.default.0': 雷云下的太阳被咬开一道缺口，暗黄色光线从云缝间漏出。
'deadwood-reblooms.SolarEclipse.thunderstorm.default.1': 遮蔽继续加深，雷声在云层深处滚动，闪电照出的天空显得更低。
'deadwood-reblooms.SolarEclipse.thunderstorm.default.2': 云层被昏光染成黄灰色，每一次闪电都让太阳上的阴影短暂显形。
'deadwood-reblooms.SolarEclipse.thunderstorm.default.3': 雷暴和黑暗叠在一起，天空像压到了屋顶上方。
'deadwood-reblooms.SolarEclipse.thunderstorm.default.4': 太阳开始恢复，闪电后的云层不再那么昏黄，远处也重新透出亮色。
'deadwood-reblooms.SolarEclipse.thunderstorm.default.5': 雷声渐远，日光穿过云缝，天空中的暗黄色随风慢慢散开。
'deadwood-reblooms.SolarEclipse.thunderstorm.default.6': 雷云仍在，但它们已经回到普通暴风雨的阴沉。

# 流星雨
'deadwood-reblooms.MeteorShower.clear': 流星接连划过晴朗的夜空，拖出明亮而短暂的银白尾迹。
'deadwood-reblooms.MeteorShower.lightClouds': 流星不时从云隙间掠过，转瞬便消失在夜色中。
'deadwood-reblooms.MeteorShower.heavyClouds': 厚重的云层遮住了流星雨，偶尔只有一线微光穿过云隙。
'deadwood-reblooms.MeteorShower.lightPrecipitation': 雨雪从夜空落下，偶尔有流星的微光从云层后透出。
'deadwood-reblooms.MeteorShower.heavyPrecipitation': 沉重的雨雪遮蔽天空，流星雨只能在云后留下模糊的闪光。
'deadwood-reblooms.MeteorShower.storm': 风暴笼罩夜空，流星的光迹偶尔在翻涌的云层之间一闪而过。
'deadwood-reblooms.MeteorShower.thunderstorm': 闪电照亮云层时，流星雨的微光仍在更高的夜空中穿行。

# Vanilla Plus
'deadwood-reblooms.VanillaPlus.willpower.feat.title': 此身为主
'deadwood-reblooms.VanillaPlus.willpower.feat.description': 即使两只史莱姆钻进耳朵，也只让身体服从自己的欲望。
'deadwood-reblooms.VanillaPlus.physique.feat.title': 枷锁尽碎
'deadwood-reblooms.VanillaPlus.physique.feat.description': 让绳索沦为调情，也让每一个试图把你压在身下的人后悔。
'deadwood-reblooms.VanillaPlus.physique.action.breakArms': 挣断手臂上的束缚
'deadwood-reblooms.VanillaPlus.physique.action.breakLegs': 挣断腿上的束缚
'deadwood-reblooms.VanillaPlus.physique.action.breakHead': 挣断头部的束缚
'deadwood-reblooms.VanillaPlus.beauty.feat.title': 天生尤物
'deadwood-reblooms.VanillaPlus.beauty.feat.description': 不施粉黛、毫无遮掩，也让镜头贪婪地追逐每一处细节。
'deadwood-reblooms.VanillaPlus.exhibitionism.feat.title': 一览无余
'deadwood-reblooms.VanillaPlus.exhibitionism.feat.description': 在泳池、舞厅与街头袒露身体，直到每一道目光都像爱抚。
'deadwood-reblooms.VanillaPlus.deviancy.feat.title': 万类来朝
'deadwood-reblooms.VanillaPlus.deviancy.feat.description': 亲自引导野兽与触手，完成森林最深处的淫靡仪式。
'deadwood-reblooms.VanillaPlus.promiscuity.feat.title': 百窍皆欢
'deadwood-reblooms.VanillaPlus.promiscuity.feat.description': 让身体每一处情愿的部位都学会乞求、索取与取悦。
'deadwood-reblooms.VanillaPlus.traits.willpower.name': 自由意志
'deadwood-reblooms.VanillaPlus.traits.willpower.text': 耳中史莱姆无法再强迫你的身体违背意愿行动。
'deadwood-reblooms.VanillaPlus.traits.physique.name': 挣脱高手
'deadwood-reblooms.VanillaPlus.traits.physique.text': 你可以主动挣断普通软束缚，每场战斗限一次。
'deadwood-reblooms.VanillaPlus.traits.beauty.name': 万人迷
'deadwood-reblooms.VanillaPlus.traits.beauty.text': 你的容貌不会跌破原本的上限。
'deadwood-reblooms.VanillaPlus.traits.exhibitionism.name': 露出成瘾
'deadwood-reblooms.VanillaPlus.traits.exhibitionism.text': 主动露出会恢复控制、降低压力与创伤，并提高性奋。
'deadwood-reblooms.VanillaPlus.traits.deviancy.name': 诡镜亲和
'deadwood-reblooms.VanillaPlus.traits.deviancy.text': 诡异镜子苏醒期间，你可以经触手平原在发现过的镜子之间通行。
'deadwood-reblooms.VanillaPlus.traits.promiscuity.name': 淫乱本能
'deadwood-reblooms.VanillaPlus.traits.promiscuity.text': 主动性行为与请求必定成功。
'deadwood-reblooms.VanillaPlus.traits.incorrigible.name': 全才
'deadwood-reblooms.VanillaPlus.traits.incorrigible.text': 纯洁性与淫荡性已同时抵达极致。意志、体格、容貌、淫乱、暴露癖与异种癖不会再降低。
'deadwood-reblooms.VanillaPlus.academic.science.name': 科学博览会冠军
'deadwood-reblooms.VanillaPlus.academic.science.text': 你详细而富有见地的科研项目获得了公开表彰。你的科学成绩不再每周自然衰减。
'deadwood-reblooms.VanillaPlus.academic.maths.name': 数学竞赛冠军
'deadwood-reblooms.VanillaPlus.academic.maths.text': 你对高难度的数学问题提出深刻解法，获得了公开表彰。你的数学成绩不再每周自然衰减。
'deadwood-reblooms.VanillaPlus.academic.english.name': 舞台剧表演者
'deadwood-reblooms.VanillaPlus.academic.english.text': 你在学生舞台剧中的惊艳演出，将整场表演推向巅峰，获得了全场的掌声。你的语文成绩不再每周自然衰减。
'deadwood-reblooms.VanillaPlus.academic.history.name': 青年历史学家
'deadwood-reblooms.VanillaPlus.academic.history.text': 你的本地历史展览获得了温特的最高评价。你的历史成绩不再每周自然衰减。
'deadwood-reblooms.VanillaPlus.history.antique.hint': '“旧目录里有一尊金制女祭司像的草图。”温特指向空着的基座，“它的造型与神殿藏品相似，来历却没有保存下来。”<br><br><<He>>转过身去。“页边只提到了森林湖勘察，没有解释两者为何会被写在一起。”'
'deadwood-reblooms.VanillaPlus.history.antique.museum': 金制女祭司像被安置在玻璃展柜中。
'deadwood-reblooms.VanillaPlus.history.antique.journal': '“旧目录里的金制女祭司像，造型与神殿藏品相似，来历却没有保存下来。页边只提到了森林湖勘察。”'
