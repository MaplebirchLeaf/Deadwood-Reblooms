# Eden — f
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.consensual.early.0': 不用管别的，先把我操好。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.consensual.early.1': 有什么不对，就直接插到底。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.consensual.middle.0': 别硬撑，我看得出来……再用力。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.consensual.middle.1': 体力不是这样浪费的……继续干我。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.consensual.late.0': 歇着也行，但先射进来。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.consensual.late.1': 我也得缓一会儿……再来一次。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.forced.early.0': 听清楚，别往旁边看……继续插。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.forced.early.1': 我不想追着你的话猜意思……直接操。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.forced.middle.0': 别绕圈子……再深一点。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.forced.middle.1': 我没有那么多耐心……把我干到失神。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.forced.late.0': 别动，我先喘口气……然后继续。
'deadwood-reblooms.LongerCombat.npc.named.Eden.f.forced.late.1': 现在别和我争……再射一次。
