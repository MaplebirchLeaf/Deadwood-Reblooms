'deadwood-reblooms:treasure:antique:hint': '"For an unusual piece of antique coinage," Winter says while gesturing at an empty pedestal. "Legend has it that mariners once cut secret stone steps into the sea cliffs of a remote island."<br><br><<He>> adjusts <<his>> spectacles thoughtfully. "Should such a vault exist, it would hold extraordinary secrets."'
'deadwood-reblooms:treasure:antique:museum': A gold coin stamped with a crude skull and radiating marks rests on display. Plaster casts and ink rubbings take the original's place when it is reclaimed.
'deadwood-reblooms:treasure:antique:journal': A strange gold coin bearing a crude skull mark. Perhaps hidden deep within a secluded passage among the island cliffs.
'deadwood-reblooms:treasure:antique:journalName': Cursed Gold Coin
