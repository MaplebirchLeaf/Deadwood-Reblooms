# Transformations translations
'deadwood-reblooms:transformations:horse:feat:title': Hooves on the Wind
'deadwood-reblooms:transformations:horse:feat:description': Reach the final stage of the horse transformation.
'deadwood-reblooms:transformations:whale:feat:title': Whale of the Wide Blue
'deadwood-reblooms:transformations:whale:feat:description': Reach the final stage of the whale transformation.
'deadwood-reblooms:clothes:mane_ribbon:description': A soft ribbon tied into a bow. Wearing it prevents horse transformation decay and suppression by other animal transformations.
'deadwood-reblooms:clothes:golden_carrot_pendant:description': A golden carrot pendant on a fine chain. Wearing it prevents horse transformation decay and suppression by other animal transformations.
'deadwood-reblooms:clothes:pearl_shell_hair_clip:description': A blue shell hair clip set with a pearl. Wearing it prevents whale transformation decay and suppression by other animal transformations.
'deadwood-reblooms:clothes:raven_feather_necklace:description': A single dark raven feather on a fine silver chain. Wearing it prevents raven transformation decay and suppression by other animal transformations.
'deadwood-reblooms:transformations:raven:feat:title': Night on Black Wings
'deadwood-reblooms:transformations:raven:feat:description': Complete your raven transformation for the first time.
