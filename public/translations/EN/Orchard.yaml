# Orchard translations
'deadwood-reblooms:orchard:trait:winemaker:name': Cellar Hand
'deadwood-reblooms:orchard:trait:winemaker:text': After bottling and delivering batch after batch of fruit wine, corking and labelling come easily to you. <span class="green">Bottling a batch by hand takes only 10 minutes</span>. You can fit a powered press and bottling bench at the winery to arrange regular production and deliveries.

'deadwood-reblooms:orchard:trait:supplier:name': Seasoned Supplier
'deadwood-reblooms:orchard:trait:supplier:text': After three drinks-shop orders and three farm contracts, you know the packing and handover routine. <span class="green">Bulk fruit sales and contract deliveries at the farm take only twenty minutes</span>.
