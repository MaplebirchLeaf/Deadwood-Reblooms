# Orchard translations
'deadwood-reblooms:orchard:trait:winemaker:name': Cellar Hand
'deadwood-reblooms:orchard:trait:winemaker:text': After bottling and delivering batch after batch of fruit wine, corking and labelling come easily to you. <span class="green">Bottling a batch by hand takes only 10 minutes</span>.

'deadwood-reblooms:orchard:feat:supply:title': From Branch to Counter
'deadwood-reblooms:orchard:feat:supply:description': "Harvest lemons or oranges from your own orchard, then fulfil an order for the same fruit at Robin's drinks shop."
'deadwood-reblooms:orchard:trait:supplier:name': Seasoned Supplier
'deadwood-reblooms:orchard:trait:supplier:text': After three drinks-shop orders and three farm contracts, you know the packing and handover routine. <span class="green">Ordinary bulk fruit deliveries take only twenty minutes</span>.
