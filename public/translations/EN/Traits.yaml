# Traits translations
'deadwood-reblooms:Traits:hooves:name': Hooves
'deadwood-reblooms:Traits:hooves:text': Kicks build three times as much defiance.
'deadwood-reblooms:combat:hooves:kick:1': You drive your heavy hooves into your opponent.
'deadwood-reblooms:combat:hooves:kick:2': Your hooves lash out with crushing force.
'deadwood-reblooms:combat:hooves:kick:3': You strike with your hooves, catching your opponent off guard.
'deadwood-reblooms:Traits:sweatblood:name': Sweat Blood
'deadwood-reblooms:Traits:sweatblood:text': Temperature has less effect on you.
'deadwood-reblooms:Traits:horse:gender': Horse <<pcGender>>
'deadwood-reblooms:Traits:horse:text': You feel the urge to run. <span class="green">Tiredness builds more slowly</span>. Your ears and tail make you more conspicuous.
'deadwood-reblooms:Traits:deep_diver:name': Deep Diver
'deadwood-reblooms:Traits:deep_diver:text': You use 75% less oxygen underwater.
'deadwood-reblooms:Traits:finned_limbs:name': Finned Limbs
'deadwood-reblooms:Traits:finned_limbs:text': Your swimming skill is increased by 10%.
'deadwood-reblooms:Traits:whale:gender': Whale <<pcGender>>
'deadwood-reblooms:Traits:whale:text': Underwater actions take half as long.
'deadwood-reblooms:Traits:ravenFeathers:name': Dark Plumage
'deadwood-reblooms:Traits:ravenFeathers:text': Your feathers soften blows. <span class="green">Pain from physical attacks is reduced by 15%</span>.
'deadwood-reblooms:Traits:raven:gender': Raven <<pcGender>>
'deadwood-reblooms:Traits:raven:text': Your voice carries. <span class="green">Speech actions are 25% more effective</span> in encounters.
'deadwood-reblooms:Traits:ominousVoice:name': Ominous Prophecy
'deadwood-reblooms:Traits:ominousVoice:text': Your words cut deep. “Disparage” can be used twice per encounter, doubling the control restored and trauma relieved. Each use <span class="green">relieves 15% of your current pain</span>.
'deadwood-reblooms:Traits:foxfire:name': Foxfire
'deadwood-reblooms:Traits:foxfire:text': Holy light curls around the tip of your tail. <span class="green">“Banish” reaches another tentacle</span>.
'deadwood-reblooms:Traits:cherishedWish:name': Cherished Wish
'deadwood-reblooms:Traits:cherishedWish:text': There is a place here for your worries. Sitting down, you can finally breathe. Daily prayer at Darkfeather Shrine <span class="green">relieves an extra 1 trauma</span>.
'deadwood-reblooms:Traits:springglow:name': Springglow
'deadwood-reblooms:Traits:springglow:text': From supporting the branches to filling the basket, you have learnt how to care for growing things. <span class="green">Effective tending is increased by 7%</span>.
