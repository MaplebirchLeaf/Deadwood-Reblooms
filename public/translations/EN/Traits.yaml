# Traits translations
'deadwood-reblooms:Traits:hooves:name': Hooves
'deadwood-reblooms:Traits:hooves:text': Kicks build three times as much defiance.
'deadwood-reblooms:combat:hooves:kick:1': You drive your heavy hooves into your opponent.
'deadwood-reblooms:combat:hooves:kick:2': Your hooves lash out with crushing force.
'deadwood-reblooms:combat:hooves:kick:3': You strike with your hooves, catching your opponent off guard.
'deadwood-reblooms:Traits:sweatblood:name': Sweat Blood
'deadwood-reblooms:Traits:sweatblood:text': Temperature has less effect on you.
'deadwood-reblooms:Traits:horse:name': Horse
'deadwood-reblooms:Traits:horse:gender': Horse <<pcGender>>
'deadwood-reblooms:Traits:horse:text': You feel the urge to run. Tiredness builds more slowly. Your ears and tail make you more conspicuous.
'deadwood-reblooms:Traits:gills:name': Deep Diver
'deadwood-reblooms:Traits:gills:text': You use 75% less oxygen underwater.
'deadwood-reblooms:Traits:finnedLimbs:name': Finned Limbs
'deadwood-reblooms:Traits:finnedLimbs:text': Your swimming skill is increased by 10%.
'deadwood-reblooms:Traits:fish:name': Fish
'deadwood-reblooms:Traits:fish:gender': Fish <<pcGender>>
'deadwood-reblooms:Traits:fish:text': Underwater actions take half as long.
'deadwood-reblooms:Traits:ravenFeathers:name': Dark Plumage
'deadwood-reblooms:Traits:ravenFeathers:text': Your feathers soften blows. Pain from physical attacks is reduced by 15%.
'deadwood-reblooms:Traits:raven:name': Raven
'deadwood-reblooms:Traits:raven:gender': Raven <<pcGender>>
'deadwood-reblooms:Traits:raven:text': Your voice carries. Speech actions are 25% more effective in encounters.
'deadwood-reblooms:Traits:ominousVoice:name': Ominous Prophecy
'deadwood-reblooms:Traits:ominousVoice:text': Your words cut deep. "Disparage" can be used twice per encounter, doubling the control restored and trauma relieved after your raven speech bonus. Each use relieves 15% of your current pain.
'deadwood-reblooms:Traits:foxfire:name': Foxfire
'deadwood-reblooms:Traits:foxfire:text': Holy light curls around the tip of your tail. "Banish" sends foxfire into another tentacle.
