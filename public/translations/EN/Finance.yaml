# Company business news
'deadwood-reblooms:finance:news:share_issue': The company has issued new shares and admitted them to trading.
'deadwood-reblooms:finance:news:share_buyback': The company has repurchased and cancelled some listed shares, reducing the issued total.
'deadwood-reblooms:finance:news:share_release': Shareholders have released a block of retained shares for sale at the desk.
'deadwood-reblooms:finance:news:share_lockup': Long-term investors have bought a block of shares that is no longer offered at the desk.
'deadwood-reblooms:finance:news:orphanage_buyout': Domus Street Orphanage has received a large advance rent settlement. Traders have raised their estimate of its near-term income.
'deadwood-reblooms:finance:news:orphanage_supplies': The donated bedding and everyday supplies have arrived at Domus Street Orphanage. With its latest purchases funded, traders have raised their estimate of its operating position.
'deadwood-reblooms:finance:news:orphanage_dispute': A dispute with residents has disrupted rent collection at Domus Street Orphanage. Traders are concerned about future income.
'deadwood-reblooms:finance:news:mso_donation': Domus Street Orphanage has received a donation towards its running costs.
'deadwood-reblooms:finance:news:mso_grant': A grant for Domus Street Orphanage has been approved. The money will be paid in instalments.
'deadwood-reblooms:finance:news:mso_repairs': Leaking pipes at Domus Street Orphanage need replacing. The repair quote exceeds the budget.
'deadwood-reblooms:finance:news:mso_arrears': Domus Street Orphanage reports more unpaid rent. Receipts are below forecast.
'deadwood-reblooms:finance:news:cafe_rumours': Rumours about the cream at Ocean Breeze are circulating among customers. Traders are watching its takings.
'deadwood-reblooms:finance:news:cafe_concern': "Questions about Ocean Breeze's ingredients have grown more persistent. Buyers are asking for reassurance."
'deadwood-reblooms:finance:news:cafe_adverts': "Ocean Breeze has released its new advertisements, photographed at Niki's studio."
'deadwood-reblooms:finance:news:cafe_closed': Ocean Breeze has closed while its two buildings are joined. The cafe will lose a month of ordinary trade.
'deadwood-reblooms:finance:news:cafe_truth': "A statement at Ocean Breeze's reopening has divided customers over its ingredients. Some diners remain unconcerned."
'deadwood-reblooms:finance:news:photo_recognition': "A model featured at Niki's studio is becoming better known. The studio is receiving more enquiries."
'deadwood-reblooms:finance:news:photo_demand': "Pictures from Niki's studio are attracting more attention. Clients are booking advertising work."
'deadwood-reblooms:finance:news:photo_prominent': "Niki's studio is displaying its best-known model prominently. Traders expect more work from the publicity."
'deadwood-reblooms:finance:news:cafe_investigation': "Police have investigated complaints about Ocean Breeze's ingredients. Traders are uncertain how customers will respond."
'deadwood-reblooms:finance:news:avy_contract': "Avery's company has secured a new contract. Investors are revising their earnings estimates."
'deadwood-reblooms:finance:news:avy_funding': "Fresh funding has been announced for Avery's company. The money is earmarked for its next project."
'deadwood-reblooms:finance:news:avy_delay': "A project at Avery's company has fallen behind schedule. Its completion date has been pushed back."
'deadwood-reblooms:finance:news:avy_costs': "Avery's company has revised its construction costs upwards. The contract price remains unchanged."
'deadwood-reblooms:finance:news:rmy_orders': Remy Estate reports a rise in orders. Buyers have reserved more of its next shipment.
'deadwood-reblooms:finance:news:rmy_land': Remy Estate has announced plans to bring more land into production.
'deadwood-reblooms:finance:news:rmy_shipment': A shipment from Remy Estate has been rejected by a buyer. Replacement stock will have to be found.
'deadwood-reblooms:finance:news:rmy_repairs': Repairs at Remy Estate are costing more than expected. Its latest accounts include the extra bill.
'deadwood-reblooms:finance:news:alf_orders': "Buyers have booked another round of deliveries from Alex's farm."
'deadwood-reblooms:finance:news:alf_harvest': "Alex's farm reports a good harvest. More produce is available for its regular buyers."
'deadwood-reblooms:finance:news:alf_spoiled': "Part of a delivery from Alex's farm has spoiled before reaching the buyer."
'deadwood-reblooms:finance:news:alf_equipment': "Equipment repairs have interrupted work at Alex's farm. Some deliveries are running late."
'deadwood-reblooms:finance:news:obc_bookings': Ocean Breeze has taken more group bookings. Extra tables are being reserved ahead of the weekend.
'deadwood-reblooms:finance:news:obc_menu': A new dish at Ocean Breeze is selling well. The cafe reports an increase in takings.
'deadwood-reblooms:finance:news:obc_supplier': An Ocean Breeze supplier has raised its prices. The cafe is reviewing its kitchen costs.
'deadwood-reblooms:finance:news:obc_cancellations': Several group bookings at Ocean Breeze have been cancelled. Tables are available again.
'deadwood-reblooms:finance:news:hsf_crowds': Harvest Street Pub reports a busy run of evening trade. Its bar has placed a larger stock order.
'deadwood-reblooms:finance:news:hsf_supplier': Harvest Street Pub has agreed a cheaper supply contract for its regular stock.
'deadwood-reblooms:finance:news:hsf_damage': Harvest Street Pub has reported damage to its fittings. Part of the bar is out of use while repairs are made.
'deadwood-reblooms:finance:news:hsf_quiet': "Harvest Street Pub's latest takings have fallen short of its forecast."
'deadwood-reblooms:finance:news:hsb_bookings': Bookings at Harvest Street Brothel have increased. Several evening slots are full.
'deadwood-reblooms:finance:news:hsb_rooms': Refurbished rooms at Harvest Street Brothel are taking bookings again. Takings have increased.
'deadwood-reblooms:finance:news:hsb_damage': Several rooms at Harvest Street Brothel have been damaged. They are out of use while repairs are made.
'deadwood-reblooms:finance:news:hsb_quiet': Harvest Street Brothel has had fewer customers lately. Takings are below forecast.
'deadwood-reblooms:finance:news:hsg_contract': Harvest Street Garage has secured a maintenance contract for a fleet of lorries. The workshop has set aside time for the work.
'deadwood-reblooms:finance:news:hsg_parts': Harvest Street Garage has agreed lower parts prices. Its existing repair orders will bring in more profit.
'deadwood-reblooms:finance:news:hsg_equipment': A lift at Harvest Street Garage has broken down. Some repairs have been delayed.
'deadwood-reblooms:finance:news:hsg_delays': Parts ordered by Harvest Street Garage have not arrived. Several customers have cancelled their repairs.
'deadwood-reblooms:finance:news:hsg_traffic': More lorries are using the road out of town. Fuel sales at Harvest Street Petrol Station have risen.
'deadwood-reblooms:finance:news:hsg_supply': Harvest Street Petrol Station has signed a new fuel supply contract at a lower price.
'deadwood-reblooms:finance:news:hsg_delivery': A tanker bound for Harvest Street Petrol Station has been delayed. Some fuels are temporarily unavailable.
'deadwood-reblooms:finance:news:hsg_pumps': Harvest Street Petrol Station needs replacement pumps. The cost exceeds its maintenance budget.
'deadwood-reblooms:finance:news:mer_cargo': Mer Shipping has secured more cargo bookings for its next sailings.
'deadwood-reblooms:finance:news:mer_turnaround': Mer Shipping reports shorter unloading times. More cargo can pass through the docks.
'deadwood-reblooms:finance:news:mer_delay': A Mer Shipping vessel is overdue. Buyers are waiting for cargo held aboard.
'deadwood-reblooms:finance:news:mer_insurance': "Mer Shipping's insurers have raised their charges. The increase will apply to its next sailings."
'deadwood-reblooms:finance:news:hsc_leases': High Street Shopping Centre has signed new tenants for its vacant units.
'deadwood-reblooms:finance:news:hsc_trade': High Street Shopping Centre reports stronger sales across its shops.
'deadwood-reblooms:finance:news:hsc_vacancies': Several High Street Shopping Centre tenants will not renew their leases.
'deadwood-reblooms:finance:news:hsc_maintenance': High Street Shopping Centre has approved repairs to its shared facilities. The bill exceeds its maintenance budget.
'deadwood-reblooms:finance:news:dsp_bookings': Danube Street Spa reports more advance bookings. Weekend appointments are filling up.
'deadwood-reblooms:finance:news:dsp_treatments': A new treatment at Danube Street Spa has attracted repeat bookings.
'deadwood-reblooms:finance:news:dsp_repairs': Part of Danube Street Spa is closed for plumbing repairs. Existing appointments are being rearranged.
'deadwood-reblooms:finance:news:dsp_refunds': Danube Street Spa has issued refunds after complaints about cancelled appointments.
'deadwood-reblooms:finance:news:elk_orders': Elk Industries has announced a new manufacturing order. Production is being scheduled.
'deadwood-reblooms:finance:news:elk_output': Elk Industries reports an increase in output without an increase in running costs.
'deadwood-reblooms:finance:news:elk_breakdown': "A breakdown has halted one of Elk Industries' production lines. Replacement parts are on order."
'deadwood-reblooms:finance:news:elk_materials': Elk Industries is paying more for raw materials. Its current orders were agreed at the old prices.
'deadwood-reblooms:finance:news:rds_customers': "Robin's drinks shop reports a rise in returning customers."
'deadwood-reblooms:finance:news:rds_supply': "Wholesalers have lowered some prices. Traders expect this to help Robin's drinks shop."
'deadwood-reblooms:finance:news:rds_spoiled': "Traders are marking down Robin's drinks-shop shares over concerns about perishable stock."
'deadwood-reblooms:finance:news:rds_repairs': "Traders expect higher equipment costs to reduce the margin at Robin's drinks shop."
'deadwood-reblooms:finance:news:csn_visitors': Connudatus Street Casino reports a rise in visitors and table takings.
'deadwood-reblooms:finance:news:csn_bookings': Connudatus Street Casino has accepted more private-room bookings.
'deadwood-reblooms:finance:news:csn_costs': Connudatus Street Casino has raised its security budget after damage to its tables.
'deadwood-reblooms:finance:news:csn_takings': Connudatus Street Casino reports weaker table takings in its latest accounts.
'deadwood-reblooms:finance:news:scb_tickets': Strip Club reports strong advance ticket sales for its next event.
'deadwood-reblooms:finance:news:scb_bookings': Strip Club has secured more private bookings.
'deadwood-reblooms:finance:news:scb_cancelled': An event at Strip Club has been cancelled. Tickets are being refunded.
'deadwood-reblooms:finance:news:scb_equipment': Strip Club has replaced damaged sound equipment. The cost appears in its latest accounts.
'deadwood-reblooms:finance:news:nps_commission': "Niki's photo studio has received a new advertising commission."
'deadwood-reblooms:finance:news:nps_prints': "Orders for prints at Niki's photo studio have increased."
'deadwood-reblooms:finance:news:nps_cancelled': "A client has cancelled a shoot at Niki's photo studio. The reserved slot is available again."
'deadwood-reblooms:finance:news:nps_equipment': "Niki's photo studio is replacing damaged equipment. Its latest accounts include the cost."

