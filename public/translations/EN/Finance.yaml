'deadwood-reblooms:finance:trait:partner:name': "Avery's Partner"
'deadwood-reblooms:finance:trait:partner:text': You have signed a partnership agreement with Avery. <span class="green">Partnership orders offer larger advances</span>, and supply policies can be negotiated. These privileges are suspended if office rent is overdue or a debt is being collected. Supply cooperation grants no shares or votes.
'deadwood-reblooms:finance:trait:board:name': Board Seat
'deadwood-reblooms:finance:trait:board:text': You have a seat at the boardroom table. Regular business contact with Avery keeps your working relationship going. <span class="green">Avery loses an extra 1 rage per day</span>, and up to 1 dominance every seven days, down to 50. The extra rage and dominance reductions apply after business contact within the last seven days, while the office is free of rent arrears or recovery action and Avery is available to meet.
'deadwood-reblooms:finance:trait:controller:name': Controlling Shareholder
'deadwood-reblooms:finance:trait:controller:text': You hold a majority of the company and carry more weight at the boardroom table. <span class="green">Avery loses an extra 1 rage per day</span>, and up to 1 dominance every seven days, down to 25. The study at the mansion is open to you, and you know where the dungeon entrance is. These benefits replace those of a board seat. The extra rage and dominance reductions apply after business contact within the last seven days, while the office is free of rent arrears or recovery action and Avery is available to meet.
'deadwood-reblooms:finance:title:black_raven': Night Raven
'deadwood-reblooms:finance:trait:ascended:name': Ascended
'deadwood-reblooms:finance:trait:ascended:text': You have ascended as the Night Raven. <span class="teal">Elk scars no longer add trauma</span>, and stress and fatigue ease over time. <span class="red">Awareness still rises and purity still fades</span>.
'deadwood-reblooms:finance:trait:buyout:name': Bought Out
'deadwood-reblooms:finance:trait:buyout:text': You settled Bailey’s account in full. <span class="gold"><<nnpc_He 'Bailey'>> no longer asks you for rent</span>. You need never walk into that office again.
'deadwood-reblooms:finance:news:bank_incident': The financial centre has suspended counter services after a bank raid. Traders expect fewer customers at nearby High Street shops. Card payments and existing deposits are unaffected.
'deadwood-reblooms:finance:news:bank_reopened': The financial centre has lifted its emergency counter suspension and will follow its usual opening hours. Traders expect some customers to return to nearby High Street shops.
'deadwood-reblooms:finance:news:heist_dock_incident': A public confrontation or theft has disrupted a dock cash transfer. Staff are checking the losses. Concerns about short-term loading and delivery delays have slightly lowered the Mer Street shipping quote.
'deadwood-reblooms:finance:news:cargo_arrest': Police have taken a loading-bay robbery suspect into custody. Traders have eased their concerns about losses on Mer Street shipments.
'deadwood-reblooms:finance:news:casino_arrest': A suspect in the casino chip fraud has been taken into custody. Traders are more confident in the gambling room's takings.
'deadwood-reblooms:finance:news:cafe_arrest': Police have taken the suspect accused of threatening Ocean Breeze staff and customers into custody. Traders expect fewer disruptions at the cafe.
'deadwood-reblooms:finance:news:street_supply': Repeated deliveries have reached this business on time and in full. Traders have slightly raised their expectations for its operations.
'deadwood-reblooms:finance:news:factory_supply': A local workshop has fulfilled another supply milestone for this business. Traders expect a steadier supply of equipment or packaging.
'deadwood-reblooms:finance:news:taxi_regular': A local taxi operator has completed a run of paid trips. Traders expect some additional demand for Harvest Street fuel and servicing.
'deadwood-reblooms:finance:news:taxi_established': A local taxi operator has completed one hundred paid trips. Traders expect more regular fuel and servicing business on Harvest Street.
'deadwood-reblooms:finance:news:factory_default': A local supplier reports that this business has refused to pay for a delivered order. Concerns about its commercial credit have lowered the quote.

'deadwood-reblooms:finance:news:heist_account_disclosure': Published copies of the financial centre’s entrusted accounts and warehouse guarantees show a dispute over the handling of the funds. Traders lower their near-term valuation of High Street Centre.
