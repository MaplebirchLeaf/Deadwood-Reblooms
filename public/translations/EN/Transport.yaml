# Vehicle descriptions
'deadwood-reblooms:transport:vehicle:town_bicycle:description': 'An upright seat and simple fittings make an inexpensive everyday ride.'
'deadwood-reblooms:transport:vehicle:mountain_bicycle:description': 'A sturdy frame and wide tyres stand up to rough paths.'
'deadwood-reblooms:transport:vehicle:road_bicycle:description': 'A light frame and narrow tyres gain speed quickly, but need more care.'
'deadwood-reblooms:transport:vehicle:scooter:description': 'A small engine makes a light, economical town runabout.'
'deadwood-reblooms:transport:vehicle:commuter_motorcycle:description': 'A steady engine and relaxed seat suit regular journeys.'
'deadwood-reblooms:transport:vehicle:sport_motorcycle:description': 'A low riding position and quick engine come with heavier maintenance.'
'deadwood-reblooms:transport:vehicle:trail_motorcycle:description': 'High suspension and knobbly tyres cope with rutted tracks.'
'deadwood-reblooms:transport:vehicle:used_saloon:description': 'Worn paint and ageing parts hide a serviceable four-door car.'
'deadwood-reblooms:transport:vehicle:saloon:description': 'A comfortable cabin with modest fuel and maintenance costs.'
'deadwood-reblooms:transport:vehicle:sports_car:description': 'Two low seats and a powerful engine make a quick road car.'
'deadwood-reblooms:transport:vehicle:van:description': 'Rows of seats and a sliding door leave room for a small group.'
'deadwood-reblooms:transport:vehicle:delivery_van:description': 'Two front seats sit ahead of a tall, enclosed load bay.'
'deadwood-reblooms:transport:vehicle:convertible:description': 'A folding roof opens both seats to the sea breeze.'
'deadwood-reblooms:transport:vehicle:luxury_saloon:description': 'A long wheelbase and thick doors keep the spacious cabin quiet.'
'deadwood-reblooms:transport:vehicle:luxury_suv:description': 'A high seat overlooks traffic, with a roomy cabin and a thirsty engine.'
'deadwood-reblooms:transport:vehicle:supercar:description': 'A low body and powerful engine demand plenty of fuel and care.'

