# CelestialAnomalies translations
'deadwood-reblooms:SolarEclipse:clear:default:0': A small bite darkens the sun's edge, dimming the bright day beneath a thin yellow haze.
'deadwood-reblooms:SolarEclipse:clear:default:1': The shadow creeps farther across the sun, washing color from the streets and greying distant shapes.
'deadwood-reblooms:SolarEclipse:clear:default:2': Sunlight weakens, turning the clear sky a dull gold as the world seems to fall quieter around you.
'deadwood-reblooms:SolarEclipse:clear:default:3': The sun is almost swallowed, and daylight sinks into a brief gloom ringed by a cold golden halo.
'deadwood-reblooms:SolarEclipse:clear:default:4': The shadow begins to slip from the sun's center, though the sky still holds an unnatural amber cast.
'deadwood-reblooms:SolarEclipse:clear:default:5': Most of the sun returns, bringing light back to the streets while yellow traces cling to roofs and clouds.
'deadwood-reblooms:SolarEclipse:clear:default:6': The last thread of shadow leaves the sun, and the sky slowly returns to normal, with only a strange afterglow remaining.
'deadwood-reblooms:SolarEclipse:lightClouds:default:0': Thin clouds drift before the sun, their edges taking on a pale yellow tint as the sky first turns strange.
'deadwood-reblooms:SolarEclipse:lightClouds:default:1': The bite in the sun widens, dulling the cloud edges and muddying the light that filters through.
'deadwood-reblooms:SolarEclipse:lightClouds:default:2': Clouds move beneath the jaundiced sky, their shadows deeper than usual and the air heavier.
'deadwood-reblooms:SolarEclipse:lightClouds:default:3': The deepest shadow presses into the clouds, leaving the sky like old paper lit by a muted golden rim.
'deadwood-reblooms:SolarEclipse:lightClouds:default:4': The sun begins to brighten again, loosening the yellow-grey gloom caught inside the clouds.
'deadwood-reblooms:SolarEclipse:lightClouds:default:5': The clouds slowly regain their pale white, though light through them still carries a grey-yellow edge.
'deadwood-reblooms:SolarEclipse:lightClouds:default:6': The sky brightens, the thin clouds turn light again, and the last stained wisps gradually fade.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:0': Beneath the heavy clouds, the sky suddenly lowers, hiding the bitten sun behind a blurred yellow gloom.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:1': The cloud base turns grey-yellow, as if the shade before a storm has deepened over the streets.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:2': Dense clouds cover the sky while strange dim light seeps through, pressing everything into dull yellow-grey.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:3': The deepest shadow hides behind the cloud-cover, leaving only a low, directionless curtain of darkness.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:4': The sun begins to recover behind the clouds, and a slow brightness thins the amber gloom.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:5': The clouds remain heavy, but light returns to the ground and distant shapes sharpen again.
'deadwood-reblooms:SolarEclipse:heavyClouds:default:6': The clouds settle back into ordinary gloom as the strange yellow-grey cast fades.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:0': Sparse rain or snow falls through the dimming light, tinting the damp air pale yellow-grey.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:1': The sky sinks further, and fine moisture blurs the distance while the streets grow colder in color.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:2': The jaundiced sky presses down on the damp air, darkening walls and pavement.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:3': The world briefly loses its sense of daytime, leaving only faint falling sounds and dark golden light.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:4': The light begins to return, and the darkness in the air thins as wet ground reflects the sky again.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:5': The streets recover a little brightness, though yellow-grey dampness still clings to the corners.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:default:6': The sky returns to normal, leaving only damp air and a brief chill behind.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:0': Drizzle falls through the dimming daylight, its threads touched with pale yellow-grey.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:1': As more of the sun is covered, the rain curtain thickens and wet ground reflects a muted gold.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:2': The jaundiced sky presses down on the drizzle, giving each puddle an old copper sheen.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:3': The rain sounds unusually clear as the streets lose their sense of daytime beneath dark gold.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:4': The sun begins to recover, thinning the darkness in the rain as brighter sky returns to the water.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:5': The drizzle continues, but the light rises again, leaving only yellow-grey traces in the wet streets.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:rain:6': The rain returns to its ordinary color, with only damp chill left behind.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:0': Snow falls through the dimming light, its edges faintly stained yellow.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:1': As the bite in the sun widens, the snow loses its clean whiteness, mixing grey-white with pale gold.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:2': The jaundiced sky makes the falling snow seem slower, while the ground reflects a cold yellow-white sheen.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:3': The snow loses its brightness and the world turns a dull milky yellow.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:4': The light begins to return, and the yellow on the snow thins, though shaded places remain muddy.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:5': The falling snow turns nearly white again as rooftops and roads recover their clarity.
'deadwood-reblooms:SolarEclipse:lightPrecipitation:snow:6': The snow mostly returns to normal, leaving only grey-yellow traces in shadow.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:0': Heavy rain or snow presses into the darkening streets, pulling the sky into a blurred yellow shadow.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:1': The sky sinks further, and distant buildings vanish into dark amber moisture.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:2': Water and shadow seem to lower the sky together, flashing dull gold across the streets.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:3': Distant shapes are swallowed completely, leaving only heavy sound and dim light.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:4': The sun begins to leave the shadow, and the yellow darkness in the air thins as distance returns.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:5': The weather has not eased, but the streets begin to recover from the deepest gloom.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:default:6': The sky returns to ordinary grey, and the strange reflections fade from water or snow.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:0': Heavy rain strikes the darkening streets, smearing the bitten sun into a blurred yellow shadow.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:1': The downpour deepens the gloom, hiding distant buildings inside dark amber mist.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:2': Rain and shadow press the sky lower together, while running water flashes with dull gold.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:3': The rain swallows distant shapes, leaving only its noise and the heavy amber light.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:4': The sun begins to leave the shadow, thinning the yellow cast in the rain and brightening the runoff.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:5': The rain has not fully eased, but the streets begin to recover from the deepest gloom.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:rain:6': The rain returns to ordinary grey, and the strange reflections vanish from the puddles.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:0': Wind-driven snow sweeps beneath the dimming sky, its outer edges stained pale yellow.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:1': As the sun is covered further, shapes blur quickly in the blizzard, leaving grey-white and dark gold.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:2': The strange glow mixes into the snowstorm, dulling your sense of direction and hiding the distance.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:3': Sky and ground churn together into a heavy yellow-white haze, with snow pressing close around you.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:4': The sun begins to recover, and the amber cast withdraws from the storm as distant outlines return.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:5': The snow is still strong, but brightness returns and the flakes no longer seem so muddy.
'deadwood-reblooms:SolarEclipse:heavyPrecipitation:snow:6': The blizzard returns to ordinary pallor and the strange tint fades from the snow.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:0': A bite appears in the sun beneath the storm clouds, leaking dark yellow light through the gaps.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:1': The covering deepens as thunder rolls within the clouds, making the lightning-lit sky feel lower.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:2': The clouds turn yellow-grey, and each flash briefly exposes the shadow across the sun.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:3': Storm and darkness overlap, pressing the sky close above the rooftops.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:4': The sun begins to recover, and the clouds after each flash no longer look so jaundiced.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:5': Thunder drifts farther away while sunlight breaks through the gaps and the amber gloom thins.
'deadwood-reblooms:SolarEclipse:thunderstorm:default:6': The storm clouds remain, but their darkness feels ordinary again.
'deadwood-reblooms:MeteorShower:clear': Meteors streak across the clear night sky, leaving bright, fleeting silver trails.
'deadwood-reblooms:MeteorShower:lightClouds': Meteors slip through gaps in the clouds before vanishing into the night.
'deadwood-reblooms:MeteorShower:heavyClouds': Heavy clouds hide the meteor shower, though an occasional glimmer breaks through.
'deadwood-reblooms:MeteorShower:lightPrecipitation': Rain or snow falls from the dark sky as faint meteors sometimes shine behind the clouds.
'deadwood-reblooms:MeteorShower:heavyPrecipitation': Heavy rain or snow obscures the sky, leaving only blurred flashes of the meteor shower beyond.
'deadwood-reblooms:MeteorShower:storm': A storm covers the night sky while meteor trails occasionally flash between the churning clouds.
'deadwood-reblooms:MeteorShower:thunderstorm': When lightning illuminates the clouds, faint meteors continue crossing the higher night sky.
