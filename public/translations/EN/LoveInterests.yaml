# LoveInterests translations
'deadwood-reblooms:loveInterests:title': Who do you consider to be your love interests?
'deadwood-reblooms:loveInterests:selected': Love interests
'deadwood-reblooms:loveInterests:available': Not lovers
'deadwood-reblooms:loveInterests:allSelected': Everyone is one of your wings!
'deadwood-reblooms:loveInterests:attitude:primary': You feel that having multiple lovers is immoral. It makes you deeply uncomfortable.
'deadwood-reblooms:loveInterests:attitude:secondary': You think having two lovers might be acceptable. But a hint of hesitation remains.
'deadwood-reblooms:loveInterests:attitude:tertiary': You feel that having too many lovers is ultimately a fault. You can't accept it with ease.
'deadwood-reblooms:loveInterests:attitude:quaternary': You accept multiple relationships with ease. It's simply a matter of personal preference.
