# Weapon clothing type
'deadwood-reblooms:clothing-type:weapon:name': Weapon
'deadwood-reblooms:clothing-type:weapon:description': A handheld weapon.
'deadwood-reblooms:clothing-type:weapon:details': Used against human attackers. Its action depends on the item.

# Street achievements and traits
'deadwood-reblooms:street:feat:quiet_heist:title': Quiet as a Mouse
'deadwood-reblooms:street:feat:quiet_heist:description': Complete a quiet bank heist and receive your share without raising the alarm or being identified.
'deadwood-reblooms:street:feat:bounty:title': In the Net
'deadwood-reblooms:street:feat:bounty:description': Complete your first verified police bounty handover and receive payment.
'deadwood-reblooms:street:feat:open_win:title': First Across
'deadwood-reblooms:street:feat:open_win:description': Finish every section of an open-class road race and take first place.
'deadwood-reblooms:street:trait:bounty_hunter:name': Bounty Hunter
'deadwood-reblooms:street:trait:bounty_hunter:text': From missing lockboxes to loading-bay robbers, you have closed and collected payment on every type of police bounty. <span class="green">While you keep working with Grant, base bounties pay 15% more</span>. The final case needed to qualify still pays the original amount.
'deadwood-reblooms:street:trait:seasoned_driver:name': Seasoned Driver
'deadwood-reblooms:street:trait:seasoned_driver:text': You know how to put less strain on a car. <span class="green">Baseline condition loss from driving is reduced by 10%</span>. Extra wear from hard driving and accidents is unchanged.
