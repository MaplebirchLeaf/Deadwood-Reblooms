'deadwood-reblooms:LifeSimulation:academic:history:name': Historical Researcher
'deadwood-reblooms:LifeSimulation:academic:history:text': Your local-history exhibition earned Winter's highest assessment. Your history grade no longer decays each week.
'deadwood-reblooms:LifeSimulation:history:antique:hint': '"An old catalogue sketches a small gold figure of a priestess," Winter says, indicating an empty pedestal. "Same shape as the temple pieces, but nobody wrote down where it came from."<br><br><<He>> turns away. "The margin only mentions a forest lake survey. It never says why the two were written on the same page."'
'deadwood-reblooms:LifeSimulation:history:antique:museum': The golden priestess statuette rests beneath glass.
'deadwood-reblooms:LifeSimulation:history:antique:journal': '"A small gold figure of a priestess sketched in an old catalogue. Its form resembles the temple collection, but its provenance was lost. The margin only mentions a survey of the forest lake."'
