# Vehicle descriptions
'deadwood-reblooms:transport:vehicle:town_bicycle:description': '坐姿舒展，维护便宜，适合日常代步。'
'deadwood-reblooms:transport:vehicle:mountain_bicycle:description': '结实的车架配着宽轮胎，经得住小径颠簸。'
'deadwood-reblooms:transport:vehicle:road_bicycle:description': '车架轻巧，窄胎提速快，保养也要勤一些。'
'deadwood-reblooms:transport:vehicle:scooter:description': '车身轻便，油耗低，适合在镇内短途往返。'
'deadwood-reblooms:transport:vehicle:commuter_motorcycle:description': '发动机平稳，坐姿舒展，适合日常通勤。'
'deadwood-reblooms:transport:vehicle:sport_motorcycle:description': '骑姿低伏，提速快，发动机和轮胎更费保养。'
'deadwood-reblooms:transport:vehicle:trail_motorcycle:description': '高悬挂与粗纹轮胎，适合荒原边缘的土路。'
'deadwood-reblooms:transport:vehicle:used_saloon:description': '车漆磨旧，零件也有些年头，仍是一辆实用的轿车。'
'deadwood-reblooms:transport:vehicle:saloon:description': '车厢舒适，油耗与保养费用适中。'
'deadwood-reblooms:transport:vehicle:sports_car:description': '双座车身低矮，发动机强劲，适合公路驾驶。'
'deadwood-reblooms:transport:vehicle:van:description': '几排座椅配着侧滑门，能载上一小群人。'
'deadwood-reblooms:transport:vehicle:delivery_van:description': '前排双座后，是一间挑高的封闭货厢。'
'deadwood-reblooms:transport:vehicle:convertible:description': '收起车顶，海风便吹进两张座椅之间。'
'deadwood-reblooms:transport:vehicle:luxury_saloon:description': '车厢宽敞安静，厚重车门隔开了街上的喧闹。'
'deadwood-reblooms:transport:vehicle:luxury_suv:description': '坐得高，车厢宽敞，油耗也高一些。'
'deadwood-reblooms:transport:vehicle:supercar:description': '低矮车身包住强劲发动机，燃油与保养都昂贵。'

