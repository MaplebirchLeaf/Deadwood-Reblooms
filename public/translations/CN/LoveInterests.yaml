# LoveInterests translations
'deadwood-reblooms:loveInterests:title': 你认为谁是你的恋人？
'deadwood-reblooms:loveInterests:selected': 恋人
'deadwood-reblooms:loveInterests:available': 非恋人
'deadwood-reblooms:loveInterests:allSelected': 大家都是你的翅膀！
'deadwood-reblooms:loveInterests:attitude:primary': 你觉得拥有多个恋人是背德的。这让你心里很不舒服。
'deadwood-reblooms:loveInterests:attitude:secondary': 你觉得拥有两个恋人或许还可以接受。但心里仍有一丝犹豫。
'deadwood-reblooms:loveInterests:attitude:tertiary': 你觉得情人太多终究是种过错。你无法坦然接受这一点。
'deadwood-reblooms:loveInterests:attitude:quaternary': 你坦然接受多段关系。这只是个人喜好的问题罢了。
