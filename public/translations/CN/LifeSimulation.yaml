'deadwood-reblooms:LifeSimulation:academic:science:name': 科学博览会冠军
'deadwood-reblooms:LifeSimulation:academic:science:text': 你详细而富有见地的科研项目获得了公开表彰。你的科学成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:academic:maths:name': 数学竞赛冠军
'deadwood-reblooms:LifeSimulation:academic:maths:text': 你对高难度的数学问题提出深刻解法，获得了公开表彰。你的数学成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:academic:english:name': 舞台剧表演者
'deadwood-reblooms:LifeSimulation:academic:english:text': 你在学生舞台剧中的惊艳演出，将整场表演推向巅峰，获得了全场的掌声。你的语文成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:academic:history:name': 历史考证者
'deadwood-reblooms:LifeSimulation:academic:history:text': 你的本地历史展览获得了温特的最高评价。你的历史成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:history:antique:hint': “旧目录里有一尊金制女祭司像的草图。”温特指向空着的基座，“和神殿那批东西造型一样，就是没人记下它从哪儿来。”<br><br><<He>>转过身去。“页边只提了一句森林湖勘察，没说这两件事为什么写在同一页上。”
'deadwood-reblooms:LifeSimulation:history:antique:museum': 金制女祭司像被安置在玻璃展柜中。
'deadwood-reblooms:LifeSimulation:history:antique:journal': “旧目录里的金制女祭司像，造型与神殿藏品相似，来历却没有保存下来。页边只提到了森林湖勘察。”
'deadwood-reblooms:LifeSimulation:history:antique:journalName': 金制女祭司像
'deadwood-reblooms:LifeSimulation:school:policy:uniform': 标准校服
'deadwood-reblooms:LifeSimulation:school:policy:free': 自由着装
'deadwood-reblooms:LifeSimulation:school:policy:revealing': 允许暴露着装
'deadwood-reblooms:LifeSimulation:school:policy:optionalNudity': 允许裸体
'deadwood-reblooms:LifeSimulation:school:policy:nudeDay': 每周裸体日
'deadwood-reblooms:LifeSimulation:school:policy:mandatoryNudity': 强制裸体
'deadwood-reblooms:LifeSimulation:school:trait:prefect:name': 风纪委员
'deadwood-reblooms:LifeSimulation:school:trait:prefect:text': 礼顿把晨间秩序和学生申诉交给了你。可以使用学生会室的休息角与自习桌，<span class="green">自行决定是否留堂</span>，职务不免除上课要求。
'deadwood-reblooms:LifeSimulation:school:trait:president:name': 学生会长
'deadwood-reblooms:LifeSimulation:school:trait:president:text': 你主持学生会，<span class="green">可以安排其他委员接手晨间值勤</span>，并向礼顿提出或恢复获批的着装校规。免听许可仍单独办理。
'deadwood-reblooms:LifeSimulation:school:trait:attendancePass:name': 免听凭证
'deadwood-reblooms:LifeSimulation:school:trait:attendancePass:text': 礼顿与贝利同意你自行安排上课时间。<span class="teal">缺席不记旷课</span>，成绩仍需自己维持。
'deadwood-reblooms:LifeSimulation:casino:trait:dealer:name': 熟练荷官
'deadwood-reblooms:LifeSimulation:casino:trait:dealer:text': 你已经熟悉牌桌上的规矩，遇上争执也能从容处理。正式荷官工作造成的<span class="green">疲劳减少 1 点</span>。
