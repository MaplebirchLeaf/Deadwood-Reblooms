'deadwood-reblooms:LifeSimulation:academic:science:name': 科学博览会冠军
'deadwood-reblooms:LifeSimulation:academic:science:text': 你详细而富有见地的科研项目获得了公开表彰。你的科学成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:academic:maths:name': 数学竞赛冠军
'deadwood-reblooms:LifeSimulation:academic:maths:text': 你对高难度的数学问题提出深刻解法，获得了公开表彰。你的数学成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:academic:english:name': 舞台剧表演者
'deadwood-reblooms:LifeSimulation:academic:english:text': 你在学生舞台剧中的惊艳演出，将整场表演推向巅峰，获得了全场的掌声。你的语文成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:academic:history:name': 青年历史学家
'deadwood-reblooms:LifeSimulation:academic:history:text': 你的本地历史展览获得了温特的最高评价。你的历史成绩不再每周自然衰减。
'deadwood-reblooms:LifeSimulation:history:antique:hint': '“旧目录里有一尊金制女祭司像的草图。”温特指向空着的基座，“它的造型与神殿藏品相似，来历却没有保存下来。”<br><br><<He>>转过身去。“页边只提到了森林湖勘察，没有解释两者为何会被写在一起。”'
'deadwood-reblooms:LifeSimulation:history:antique:museum': 金制女祭司像被安置在玻璃展柜中。
'deadwood-reblooms:LifeSimulation:history:antique:journal': '“旧目录里的金制女祭司像，造型与神殿藏品相似，来历却没有保存下来。页边只提到了森林湖勘察。”'
'deadwood-reblooms:LifeSimulation:history:antique:journalName': 金制女祭司像
