'deadwood-reblooms:treasure:antique:hint': “这是为一枚古怪的旧铸币准备的，”温特指着空置的展台说道，“传闻曾有远洋水手在远海荒岛的崖壁下见过人工修凿的隐秘阶石。”<br><br><<He>>若有所思地推了推眼镜。“若是真有这样的洞窟，里面的秘密恐怕非同小可。”
'deadwood-reblooms:treasure:antique:museum': 一枚刻有骷髅图腾与粗砺铭文的金币陈列在此。原物借展归还后，底座上展示着温特制作的精细石膏翻模与墨拓记录。
'deadwood-reblooms:treasure:antique:journal': 一枚带有骷髅图腾的异样金币。或许藏在海岛崖壁间的隐秘旧通道深处。
'deadwood-reblooms:treasure:antique:journalName': 诅咒金币
