'deadwood-reblooms:VanillaPlus:traits:sadomasochist:name': 嗜虐
'deadwood-reblooms:VanillaPlus:traits:sadomasochist:text': 无论承受还是施加折磨，都令你着迷。<span class="teal">施虐与受虐倾向不再自然衰减</span>。你可以在态度中调整是否反思这些行为。
