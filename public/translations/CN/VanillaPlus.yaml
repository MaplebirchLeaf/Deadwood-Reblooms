'deadwood-reblooms:VanillaPlus:promiscuity:action:guidePlayerVaginaDouble': 将{name}的肉棒移到你小穴里的另一根肉棒旁
'deadwood-reblooms:VanillaPlus:promiscuity:action:guidePlayerAnus': 将{name}的肉棒移到你的菊穴口
