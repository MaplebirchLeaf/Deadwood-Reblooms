'deadwood-reblooms:VanillaPlus:divineTransformations:action:expunge': 清除
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:angel:name': 天使
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:angel:text': 你散发着纯洁的光芒。<span class="green">有效体能提高 10%</span>。每场战斗可使用一次“宽恕”，<span class="green">消除本场已经获得的创伤</span>。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:angel:warning': <span class="red">失去贞操会使你失去这一特质</span>，光环也会破碎。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:fallenAngel:name': 堕天使
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:fallenAngel:text': 世界是如此残酷，但你不会放弃自己。<span class="green">有效意志提高 10%</span>。解锁“讥讽”行动，每场遭遇战可使用一次“清除”，以体内的空洞同时伤害所有野兽、异物与触手。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:ironWill:name': 钢铁意志
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:ironWill:text': 这世间的磨难固然沉重，但你足够强大，可以扛下一切。<span class="teal">意志不再自然衰减</span>。你可以在<span class="lblue">态度</span>中选择压制平时的性奋，避免意外高潮。自慰、战斗与格威岚的仪式不受这项压制影响。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:trinity:name': 三位一体
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:trinity:text': 神圣、堕落与欲望在你体内达成了平衡。<span class="deadwood-trinity">天使、堕天使与恶魔可以共存、共同成长</span>，<span class="teal">成长点数不再减少</span>。每种转化仍需满足各自的成长条件。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:demon:bonus': <span class="green">有效容貌提高 10%</span>。<span class="lewd">遭遇战中，你的乳汁与精液不会耗尽</span>。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:demon:text': 你失去了纯洁。<span class="green">有效容貌提高 10%</span>。<span class="lewd">遭遇战中，你的乳汁与精液不会耗尽</span>。每当有东西在你体内射精，或者你在别的体内射精时，你会减少创伤。触手能减少压力和痛苦，但不能减少创伤。<span class="red">以多于最低限度的纯洁结束一天，压力会出乎意料</span>。
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:pleasure': 主动用它们获得快感
'deadwood-reblooms:VanillaPlus:handGrip:action:grip': 抓住{name}的腰臀
'deadwood-reblooms:VanillaPlus:handGrip:action:keep': 继续抓住
'deadwood-reblooms:VanillaPlus:handGrip:action:noEscape': 不许逃跑！
'deadwood-reblooms:VanillaPlus:handGrip:action:release': 停止
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockVagina': 用双腿锁住{names}
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockAnus': 用双腿锁住{names}
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockKeepMissionary': 继续用腿束缚
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockKeepRear': 继续锁着
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockReleaseMissionary': 放开
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockReleaseRear': 停止
'deadwood-reblooms:VanillaPlus:traits:unlocked': 你获得了特殊特质：{name}。
'deadwood-reblooms:VanillaPlus:unlock': 你的{name}突破了原本的极限。
'deadwood-reblooms:VanillaPlus:traits:willpower:name': 不屈意志
'deadwood-reblooms:VanillaPlus:traits:willpower:text': <span class="teal">耳中的史莱姆再也无法迫使你违背意愿</span>。战斗中，疼痛达到极限时，你还能再承受相当于原极限一半的伤害。
'deadwood-reblooms:VanillaPlus:traits:physique:name': 无拘无束
'deadwood-reblooms:VanillaPlus:traits:physique:text': 普通的软质束缚再也困不住你。<span class="gold">每场战斗可主动挣脱一次</span>。
'deadwood-reblooms:VanillaPlus:traits:beauty:name': 摄人心魄
'deadwood-reblooms:VanillaPlus:traits:beauty:text': <span class="teal">容貌不会再跌破曾经的极限</span>。<span class="green">诱惑检定提高一个等级</span>。乞求会<span class="green">额外降低 25 点怒气</span>，成功道歉会<span class="green">多降低 25% 的怒气</span>。
'deadwood-reblooms:VanillaPlus:traits:exhibitionism:name': 露出成瘾
'deadwood-reblooms:VanillaPlus:traits:exhibitionism:text': 主动暴露身体会<span class="green">恢复控制、减轻压力</span>并<span class="lewd">提高性奋</span>。当你习惯裸体后，可以一丝不挂地在城镇中行走。每次行动都会提高暴露癖与性奋，但也会<span class="red">增加创伤并损害名声</span>。
'deadwood-reblooms:VanillaPlus:traits:deviancy:name': 超越禁忌
'deadwood-reblooms:VanillaPlus:traits:deviancy:text': 你可以拒绝格威岚的要求，但<span class="red">错过时限仍会受到惩罚</span>。诡异镜子苏醒时，<span class="green">你能在已发现的镜子之间通行</span>。你的身体也容得下更多野性：<span class="teal">所有动物转化可以共存、共同成长，不再彼此排斥或自然衰退</span>。每种转化仍需积累各自的成长点数。
'deadwood-reblooms:VanillaPlus:traits:promiscuity:name': 欲望主宰
'deadwood-reblooms:VanillaPlus:traits:promiscuity:text': 遭遇中，你发起的部分亲密动作与姿势请求<span class="lewd">必定通过技能检定</span>。部位占用、拘束、贞操装置与目标状态仍会限制可用动作。
'deadwood-reblooms:VanillaPlus:traits:incorrigible:name': 全能
'deadwood-reblooms:VanillaPlus:traits:incorrigible:text': 纯洁与淫荡在你身上同时抵达了极限。意志、体能、容貌、淫乱、暴露癖与异种癖<span class="teal">不会再降低</span>。
'deadwood-reblooms:VanillaPlus:incorrigible:feat:title': 全能
'deadwood-reblooms:VanillaPlus:incorrigible:feat:description': 令意志、体能、容貌、淫乱、暴露癖与异种癖全部达到突破后的极限。
'deadwood-reblooms:feats:Own Keys:name': 一把自己的钥匙
'deadwood-reblooms:feats:Own Keys:text': 首次购入一处自住房。
'deadwood-reblooms:feats:Feels Like Home:name': 终于像个家
'deadwood-reblooms:feats:Feels Like Home:text': 为同一处自住房配齐床、衣柜、桌子、椅子和饰品。有书房的住宅还需配备书桌。
'deadwood-reblooms:feats:Leave a Light On:name': 留一盏灯
'deadwood-reblooms:feats:Leave a Light On:text': 与正式入住自住房的恋人完成一次日常陪伴。
'deadwood-reblooms:feats:Beyond the Mirror:name': 镜子的另一边
'deadwood-reblooms:feats:Beyond the Mirror:text': 穿过触手平原，从另一处已发现的镜子离开。
'deadwood-reblooms:feats:Evidence Matters:name': 言之有据
'deadwood-reblooms:feats:Evidence Matters:text': 记录湖底文物的发现位置，并在历史项目的研究、草稿与答辩中始终区分证据与推测。
'deadwood-reblooms:feats:Ride the Wind:name': 顺风而行
'deadwood-reblooms:feats:Ride the Wind:text': 从自住房高处滑翔，落到另一条街道。
