# VanillaPlus translations
'deadwood-reblooms:VanillaPlus:traits:sadomasochist:name': 嗜虐
'deadwood-reblooms:VanillaPlus:traits:sadomasochist:text': '无论承受还是施加折磨，都令你着迷。<span class="def">施虐与受虐倾向不再自然衰减。</span>'
'deadwood-reblooms:VanillaPlus:willpower:feat:title': 身为己有
'deadwood-reblooms:VanillaPlus:willpower:feat:description': 即使两只史莱姆钻进耳朵，也只让身体服从自己的欲望。
'deadwood-reblooms:VanillaPlus:physique:feat:title': 挣脱极限
'deadwood-reblooms:VanillaPlus:physique:feat:description': 让绳索沦为调情，也让每一个试图把你压在身下的人后悔。
'deadwood-reblooms:VanillaPlus:physique:action:breakArms': 挣断手臂上的束缚
'deadwood-reblooms:VanillaPlus:physique:action:breakLegs': 挣断腿上的束缚
'deadwood-reblooms:VanillaPlus:physique:action:breakHead': 挣断头部的束缚
'deadwood-reblooms:VanillaPlus:beauty:feat:title': 倾国倾城
'deadwood-reblooms:VanillaPlus:beauty:feat:description': 不施粉黛、毫无遮掩，也让镜头贪婪地追逐每一处细节。
'deadwood-reblooms:VanillaPlus:exhibitionism:feat:title': 众目之下
'deadwood-reblooms:VanillaPlus:exhibitionism:feat:description': 在泳池、舞厅与街头袒露身体，直到每一道目光都像爱抚。
'deadwood-reblooms:VanillaPlus:deviancy:feat:title': 禁忌仪式
'deadwood-reblooms:VanillaPlus:deviancy:feat:description': 亲自引导野兽与触手，完成森林最深处的淫靡仪式。
'deadwood-reblooms:VanillaPlus:promiscuity:feat:title': 寸寸皆欢
'deadwood-reblooms:VanillaPlus:promiscuity:feat:description': 让身体每一处情愿的部位都学会乞求、索取与取悦。
'deadwood-reblooms:VanillaPlus:promiscuity:action:straddleVaginal': 跨坐在{name}的肉棒上，提供双龙入穴
'deadwood-reblooms:VanillaPlus:promiscuity:action:straddleAnal': 跨坐在{name}的肉棒上，提供菊穴双插
'deadwood-reblooms:VanillaPlus:promiscuity:action:pressVagina': 将你的肉棒抵向{name}的小穴
'deadwood-reblooms:VanillaPlus:promiscuity:action:pressAnus': 将你的肉棒抵向{name}的菊穴
'deadwood-reblooms:VanillaPlus:promiscuity:action:switchVagina': 将你的肉棒移到{name}的小穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:switchAnus': 将你的肉棒移到{name}的菊穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:guidePlayerVagina': 将{name}的肉棒移到你的小穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:guidePlayerVaginaDouble': 将{name}的肉棒移到你小穴里的另一根肉棒旁
'deadwood-reblooms:VanillaPlus:promiscuity:action:guidePlayerAnus': 将{name}的肉棒移到你的菊穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:guidePlayerAnusDouble': 将{name}的肉棒移到你菊穴里的另一根肉棒旁
'deadwood-reblooms:VanillaPlus:promiscuity:action:guideNPCVagina': 将{name}的肉棒移到{recipient}的小穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:guideNPCAnus': 将{name}的肉棒移到{recipient}的菊穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:tongueKiss': 舌吻
'deadwood-reblooms:VanillaPlus:divineTransformations:action:expunge': 清除
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:angel:name': 天使
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:angel:text': 你散发着纯洁的光芒。有效体能提高10%。每次战斗可使用一次“宽恕”行动，消除本场战斗中已经获得的创伤。但要小心，失去贞操会使你失去这一特质，并使你的光环破碎。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:fallenAngel:name': 堕天使
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:fallenAngel:text': 世界是如此残酷。虽然你感到自己的纯洁正与日俱减，但你不会放弃自己。有效意志提高10%。解锁“讥讽”行动，并可在每场遭遇战中使用一次“清除”，以体内的空洞同时伤害所有野兽、异物与触手。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:ironWill:name': 钢铁意志
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:ironWill:text': 这世间的磨难固然沉重，但你足够强大，可以扛下一切。<span class="teal">你的意志将不再衰减</span>。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:trinity:name': 三位一体
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:trinity:text': 你记不起那一瞬间先发生了什么。<span class="gold">神圣</span>、<span class="black">堕落</span>与<span class="purple">欲望</span>能够一同留在你的身体里。三种神圣转化可以共同成长，<span class="teal">成长点数不再衰减</span>。
'deadwood-reblooms:VanillaPlus:divineTransformations:trait:demon:text': 你失去了纯洁。有效容貌提高10%。遭遇战中，你的乳汁与精液不会耗尽。每当有东西在你体内射精，或者你在别的体内射精时，你会减少创伤。触手能减少压力和痛苦，但不能减少创伤。一定要小心，保有任何纯洁而不是以最低限度的纯洁结束一天时，你会受到意想不到的压力。
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:pleasure': 主动用它们获得快感
'deadwood-reblooms:VanillaPlus:handGrip:action:grip': 抓住{name}的腰臀
'deadwood-reblooms:VanillaPlus:handGrip:action:keep': 继续抓住
'deadwood-reblooms:VanillaPlus:handGrip:action:noEscape': 不许逃跑！
'deadwood-reblooms:VanillaPlus:handGrip:action:release': 停止
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockVagina': 用双腿锁住{names}
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockAnus': 用双腿锁住{names}
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockKeepMissionary': 继续用腿束缚
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockKeepRear': 继续锁着
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockReleaseMissionary': 放开
'deadwood-reblooms:VanillaPlus:NPCDoublePenetration:action:legLockReleaseRear': 停止
'deadwood-reblooms:VanillaPlus:traits:unlocked': 你获得了特殊特质：{name}。
'deadwood-reblooms:VanillaPlus:traits:willpower:name': 不屈意志
'deadwood-reblooms:VanillaPlus:traits:willpower:text': <span class="green">耳中的史莱姆再也无法迫使你的身体违背意愿</span>。战斗中，疼痛达到极限时，你还能再承受相当于原极限一半的伤害。
'deadwood-reblooms:VanillaPlus:traits:physique:name': 无拘无束
'deadwood-reblooms:VanillaPlus:traits:physique:text': 普通的软质束缚再也困不住你。<span class="green">每场战斗可主动挣脱一次</span>。
'deadwood-reblooms:VanillaPlus:traits:beauty:name': 摄人心魄
'deadwood-reblooms:VanillaPlus:traits:beauty:text': <span class="teal">你的容貌不会再跌破曾经的极限</span>。<span class="green">诱惑检定提高一个等级</span>。乞求会额外降低25点怒气，成功道歉会多降低25%的怒气。
'deadwood-reblooms:VanillaPlus:traits:exhibitionism:name': 露出成瘾
'deadwood-reblooms:VanillaPlus:traits:exhibitionism:text': 主动暴露身体会<span class="green">恢复控制、减轻压力</span>并<span class="lewd">提高性奋</span>。当你习惯裸体后，可以一丝不挂地在城镇中行走。每次行动都会提高暴露癖与性奋，但也会<span class="red">增加创伤并损害名声</span>。
'deadwood-reblooms:VanillaPlus:traits:deviancy:name': 超越禁忌
'deadwood-reblooms:VanillaPlus:traits:deviancy:text': 你可以拒绝格威岚的要求，但<span class="red">错过时限仍会受到惩罚</span>。诡异镜子苏醒时，你可以穿过触手平原，<span class="teal">在已经发现的镜子之间通行</span>。
'deadwood-reblooms:VanillaPlus:traits:promiscuity:name': 欲望主宰
'deadwood-reblooms:VanillaPlus:traits:promiscuity:text': <span class="lewd">你发起的性行为与请求必定成功</span>。
'deadwood-reblooms:VanillaPlus:traits:incorrigible:name': 全能
'deadwood-reblooms:VanillaPlus:traits:incorrigible:text': 纯洁与淫荡在你身上同时抵达了极限。意志、体能、容貌、淫乱、暴露癖与异种癖<span class="teal">不会再降低</span>。
'deadwood-reblooms:VanillaPlus:incorrigible:feat:title': 全能
'deadwood-reblooms:VanillaPlus:incorrigible:feat:description': 令意志、体能、容貌、淫乱、暴露癖与异种癖全部达到突破后的极限。
'deadwood-reblooms:feats:Own Keys:name': 一把自己的钥匙
'deadwood-reblooms:feats:Own Keys:text': 首次购入一处自住房。
'deadwood-reblooms:feats:Feels Like Home:name': 终于像个家
'deadwood-reblooms:feats:Feels Like Home:text': 为同一处自住房配齐床、衣柜、桌子、椅子和饰品。有书房的住宅还需配备书桌。
'deadwood-reblooms:feats:Leave a Light On:name': 留一盏灯
'deadwood-reblooms:feats:Leave a Light On:text': 与正式入住自住房的恋人完成一次日常陪伴。
'deadwood-reblooms:feats:Beyond the Mirror:name': 镜子的另一边
'deadwood-reblooms:feats:Beyond the Mirror:text': 穿过触手平原，从另一处已发现的镜子离开。
'deadwood-reblooms:feats:Evidence Matters:name': 言之有据
'deadwood-reblooms:feats:Evidence Matters:text': 记录湖底文物的发现位置，并在历史项目的研究、草稿与答辩中始终区分证据与推测。
'deadwood-reblooms:feats:Ride the Wind:name': 顺风而行
'deadwood-reblooms:feats:Ride the Wind:text': 从自住房高处滑翔，落到另一条街道。
