'deadwood-reblooms:VanillaPlus:promiscuity:action:straddleAnal': 跨坐在{name}的肉棒上，提供菊穴双插
'deadwood-reblooms:VanillaPlus:promiscuity:action:pressVagina': 将你的肉棒抵向{name}的小穴
'deadwood-reblooms:VanillaPlus:promiscuity:action:pressAnus': 将你的肉棒抵向{name}的菊穴
'deadwood-reblooms:VanillaPlus:promiscuity:action:switchVagina': 将你的肉棒移到{name}的小穴口
'deadwood-reblooms:VanillaPlus:promiscuity:action:switchAnus': 将你的肉棒移到{name}的菊穴口
