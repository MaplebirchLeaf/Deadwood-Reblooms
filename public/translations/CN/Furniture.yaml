# Native furniture labels for owned-property catalogues.
'deadwood-reblooms:finance:furniture:chair:nameCap': 椅子
'deadwood-reblooms:finance:furniture:chair:description': 一把破旧、嘎吱作响的椅子。晃且坐着难受。
'deadwood-reblooms:finance:furniture:stool:nameCap': 木凳
'deadwood-reblooms:finance:furniture:stool:description': 一只普通的凳子。不舒适，但总比没有好。
'deadwood-reblooms:finance:furniture:woodenchair:nameCap': 木椅
'deadwood-reblooms:finance:furniture:woodenchair:description': 一张寻常的木椅，不是很舒适。
'deadwood-reblooms:finance:furniture:swivelchair:nameCap': 旋转椅
'deadwood-reblooms:finance:furniture:swivelchair:description': 一把人体工学转椅，完美且舒适。
'deadwood-reblooms:finance:furniture:shellchair:nameCap': 贝壳椅
'deadwood-reblooms:finance:furniture:shellchair:description': 一把带有贝壳形靠背的转椅，十分奢华。
'deadwood-reblooms:finance:furniture:armchair:nameCap': 单人扶手椅
'deadwood-reblooms:finance:furniture:armchair:description': 一套单人扶手椅。柔软、舒适、奢侈。
'deadwood-reblooms:finance:furniture:egg:nameCap': 蛋壳扶手椅
'deadwood-reblooms:finance:furniture:egg:description': 一张颜色奇异的圆形扶手椅，非常难组装。
'deadwood-reblooms:finance:furniture:woodentable:nameCap': 木桌
'deadwood-reblooms:finance:furniture:woodentable:description': 可用来办公学习或是聚会使用，需要搭配椅子。
'deadwood-reblooms:finance:furniture:marbletable:nameCap': 大理石桌
'deadwood-reblooms:finance:furniture:marbletable:description': 一张拥有大理石桌面的寻常木桌。
'deadwood-reblooms:finance:furniture:desk:nameCap': 基础书桌
'deadwood-reblooms:finance:furniture:desk:description': 一张老旧的书桌，刻满了过往孤儿留下的涂鸦。
'deadwood-reblooms:finance:furniture:deskGlass:nameCap': 玻璃书桌
'deadwood-reblooms:finance:furniture:deskGlass:description': 一张时髦的现代书桌，很容易弄坏。
'deadwood-reblooms:finance:furniture:deskMidcentury:nameCap': 50年代书桌
'deadwood-reblooms:finance:furniture:deskMidcentury:description': 一张现代主义风格的书桌，在二十世纪中叶十分流行。
'deadwood-reblooms:finance:furniture:deskAntique:nameCap': 古董桌
'deadwood-reblooms:finance:furniture:deskAntique:description': 一张华丽的古董书桌，为终身使用专造。
'deadwood-reblooms:finance:furniture:bed:nameCap': 普通床
'deadwood-reblooms:finance:furniture:bed:description': 一张破烂的旧床，很不舒服。
'deadwood-reblooms:finance:furniture:singlebed:nameCap': 单人床
'deadwood-reblooms:finance:furniture:singlebed:description': 一张普通的单人床。
'deadwood-reblooms:finance:furniture:singlebeddeluxe:nameCap': 豪华单人床
'deadwood-reblooms:finance:furniture:singlebeddeluxe:description': 一张符合人体工学设计的单人床，非常舒适。
'deadwood-reblooms:finance:furniture:doublebed:nameCap': 双人床
'deadwood-reblooms:finance:furniture:doublebed:description': 一张普通的双人床，可容下两个人。
'deadwood-reblooms:finance:furniture:doublebeddeluxe:nameCap': 豪华双人床
'deadwood-reblooms:finance:furniture:doublebeddeluxe:description': 一张漂亮的床，配有柔软的床垫。非常舒适，可以容下两个人。
'deadwood-reblooms:finance:furniture:doublebedexotic:nameCap': 进口双人床
'deadwood-reblooms:finance:furniture:doublebedexotic:description': 一张现代极简主义风格的床。非常舒适，可以容下两个人。
'deadwood-reblooms:finance:furniture:doublebedwicker:nameCap': 藤艺双人床
'deadwood-reblooms:finance:furniture:doublebedwicker:description': 一张全藤织框架的双人床。非常舒适，可以容下两个人。
'deadwood-reblooms:finance:furniture:plantpot:nameCap': 花盆
'deadwood-reblooms:finance:furniture:plantpot:description': 带有肥沃土壤的陶罐。花已预先种好，可以放在窗台上。
'deadwood-reblooms:finance:furniture:bunnySucculent:nameCap': 兔耳多肉
'deadwood-reblooms:finance:furniture:bunnySucculent:description': "用来种植多肉的水泥花盆。已预植有'碧光环'，也被称为兔耳多肉。"
'deadwood-reblooms:finance:furniture:jar:nameCap': 瓶子
'deadwood-reblooms:finance:furniture:jar:description': 普通的圆形瓶子，可放在窗台上。
'deadwood-reblooms:finance:furniture:penguinplushie:nameCap': 企鹅毛绒玩具
'deadwood-reblooms:finance:furniture:penguinplushie:description': 可爱又柔软，可以放在你的窗台上。
'deadwood-reblooms:finance:furniture:yespillow:nameCap': 【YES枕】
'deadwood-reblooms:finance:furniture:yespillow:description': 上面印着大大的“YES”。<br>你可以把它展示在你的窗台上，那就代表你热情地同意了。<br>想做♥？那就去做♥吧~
'deadwood-reblooms:finance:furniture:nopillow:nameCap': 【NO枕】
'deadwood-reblooms:finance:furniture:nopillow:description': 上面印着大大的“NO”。<br>不行，就是不行！<br>你可以放在窗台上。
'deadwood-reblooms:finance:furniture:calendar:nameCap': 挂历
'deadwood-reblooms:finance:furniture:calendar:description': 普通的挂历，上面印满了数字。
'deadwood-reblooms:finance:furniture:painting:nameCap': 挂画
'deadwood-reblooms:finance:furniture:painting:description': 仿真的工业印刷品，并不是真正的画。
'deadwood-reblooms:finance:furniture:banner:nameCap': 海报
'deadwood-reblooms:finance:furniture:banner:description': 中间印着老电影里的一名角色。
'deadwood-reblooms:finance:furniture:bannerlewd:nameCap': 色情海报
'deadwood-reblooms:finance:furniture:bannerlewd:description': 印着一只巨大的触手。
'deadwood-reblooms:finance:furniture:bannerfestive:nameCap': 节日海报
'deadwood-reblooms:finance:furniture:bannerfestive:description': 虽然可能不是很合时宜，但看起来依旧很酷。
'deadwood-reblooms:finance:furniture:bearplushie:nameCap': 超大熊玩偶
'deadwood-reblooms:finance:furniture:bearplushie:description': 柔软，可爱，永远忠诚。
'deadwood-reblooms:finance:furniture:candypillow:nameCap': 大号糖果枕头
'deadwood-reblooms:finance:furniture:candypillow:description': 柔软又甜蜜。
'deadwood-reblooms:finance:furniture:owlplushie:nameCap': 猫头鹰玩偶
'deadwood-reblooms:finance:furniture:owlplushie:description': 大大的眼睛凝视着世界。
'deadwood-reblooms:finance:furniture:wardrobe:nameCap': 破旧的衣橱
'deadwood-reblooms:finance:furniture:wardrobe:description': 破旧，嘎吱作响的衣橱，装不了太多东西。
'deadwood-reblooms:finance:furniture:wardrobebasic:nameCap': 普通衣橱
'deadwood-reblooms:finance:furniture:wardrobebasic:description': 一个基本的衣柜。
'deadwood-reblooms:finance:furniture:armoire:nameCap': 大型衣橱
'deadwood-reblooms:finance:furniture:armoire:description': 一个宽敞的木制大衣橱。
'deadwood-reblooms:finance:furniture:organiser:nameCap': 组合衣橱
'deadwood-reblooms:finance:furniture:organiser:description': 一个拥有大量空间的衣橱。
'deadwood-reblooms:finance:furniture:carved:nameCap': 錾刻衣橱
'deadwood-reblooms:finance:furniture:carved:description': 一个纯手工雕刻的豪华衣橱，含有多个抽屉和衣架杆。
'deadwood-reblooms:finance:furniture:poster:nameCap': 空白海报
'deadwood-reblooms:finance:furniture:poster:description': 海报上目前空无一物。
'deadwood-reblooms:finance:furniture:wallpaper:nameCap': 空白墙纸
'deadwood-reblooms:finance:furniture:wallpaper:description': 墙纸上目前空无一物。
