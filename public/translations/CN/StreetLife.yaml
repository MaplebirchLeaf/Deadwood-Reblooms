# Weapon clothing type
'deadwood-reblooms:clothing-type:weapon:name': 武器
'deadwood-reblooms:clothing-type:weapon:description': 手持武器。
'deadwood-reblooms:clothing-type:weapon:details': 可用于反击人类袭击者，具体动作取决于物品。

# Street achievements and traits
'deadwood-reblooms:street:feat:quiet_heist:title': 悄然无声
'deadwood-reblooms:street:feat:quiet_heist:description': 完成一次安静的银行豪劫并实际分到账款，全程没有触发警报或被认出。
'deadwood-reblooms:street:feat:bounty:title': 收网
'deadwood-reblooms:street:feat:bounty:description': 首次完成警方悬赏的核实与移交，并领取报酬。
'deadwood-reblooms:street:feat:open_win:title': 先到一步
'deadwood-reblooms:street:feat:open_win:description': 完整跑完公路赛进阶组的全部赛段，并取得第一名。
'deadwood-reblooms:street:trait:bounty_hunter:name': 赏金猎人
'deadwood-reblooms:street:trait:bounty_hunter:text': 从失窃的钱箱到卸货口的劫货者，各类警方悬赏都留下了你的结案记录，报酬也已结清。<span class="green">与格兰特保持合作时，基础赏金增加 15%</span>。最后补齐记录的那一单仍按原价结算。
'deadwood-reblooms:street:trait:seasoned_driver:name': 老练车手
'deadwood-reblooms:street:trait:seasoned_driver:text': 你知道如何让汽车少受些折腾。<span class="green">行驶时的基础车况损耗减少 10%</span>。激烈驾驶与事故造成的额外损耗照常。
