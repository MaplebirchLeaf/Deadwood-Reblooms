# Orchard translations

'deadwood-reblooms:orchard:feat:supply:title': 从枝头到柜台
'deadwood-reblooms:orchard:feat:supply:description': 采收过自行种植的柠檬或橙子，并完成相应品种的一笔罗宾饮品店供货订单。
'deadwood-reblooms:orchard:trait:supplier:name': 货路熟手
'deadwood-reblooms:orchard:trait:supplier:text': 完成三笔饮品店供货订单与三笔农场长单后，你熟悉了装箱与交接。<span class="green">普通批量水果交货只需 20 分钟</span>。
'deadwood-reblooms:orchard:trait:winemaker:name': 酿酒熟手
'deadwood-reblooms:orchard:trait:winemaker:text': 一批批果酒装瓶送出，你做起封瓶和贴标已得心应手。<span class="green">手工装瓶每批只需 10 分钟</span>。
