# Orchard translations

'deadwood-reblooms:orchard:trait:supplier:name': 货路熟手
'deadwood-reblooms:orchard:trait:supplier:text': 完成三笔饮品店供货订单与三笔农场长单后，你熟悉了装箱与交接。<span class="green">在农场批量出售水果或交付长单只需 20 分钟</span>。
'deadwood-reblooms:orchard:trait:winemaker:name': 酿酒熟手
'deadwood-reblooms:orchard:trait:winemaker:text': 一批批果酒装瓶送出，你做起封瓶和贴标已得心应手。<span class="green">手工装瓶每批只需 10 分钟</span>。可以在酿酒间添置电动压榨机与封瓶台，安排定期生产和配送。
