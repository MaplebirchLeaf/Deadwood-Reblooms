# Traits translations
'deadwood-reblooms:Traits:hooves:name': 蹄足
'deadwood-reblooms:Traits:hooves:text': 踢击的反抗效果提高至三倍。
'deadwood-reblooms:combat:hooves:kick:1': 你猛然踢出，沉重的蹄足狠狠砸向对手。
'deadwood-reblooms:combat:hooves:kick:2': 你的蹄足破空而至，迸发出骇人的力量。
'deadwood-reblooms:combat:hooves:kick:3': 你以蹄足发起重击，震得对手猝不及防。
'deadwood-reblooms:Traits:sweatblood:name': 汗血
'deadwood-reblooms:Traits:sweatblood:text': 温度对你的影响降低。
'deadwood-reblooms:Traits:horse:gender': 马<<pcGender>><<deadwood-trait-sex>>
'deadwood-reblooms:Traits:horse:text': 你渴望奔跑。<span class="green">疲劳积累得更慢</span>。你的耳朵和尾巴让你更加显眼。
'deadwood-reblooms:Traits:deep_diver:name': 深潜
'deadwood-reblooms:Traits:deep_diver:text': 水下氧气消耗减少 75%。
'deadwood-reblooms:Traits:finned_limbs:name': 鳍肢
'deadwood-reblooms:Traits:finned_limbs:text': 游泳技能提高 10%。
'deadwood-reblooms:Traits:whale:gender': 鲸<<pcGender>><<deadwood-trait-sex>>
'deadwood-reblooms:Traits:whale:text': 水下行动所需的时间减半。
'deadwood-reblooms:Traits:undying:name': 不朽
'deadwood-reblooms:Traits:undying:text': 你的身体已失去痛觉。<span class="green">免疫伤害造成的疼痛</span>。
'deadwood-reblooms:Traits:desire:name': 寡欲
'deadwood-reblooms:Traits:desire:text': 温热的触碰已难以唤起你的欲望。<span class="lblue">性奋增长减少75%</span>。
'deadwood-reblooms:Traits:undead:name': 亡灵<<if $player.gender isnot "n">><<pcGender>><</if>><<deadwood-trait-sex>>
'deadwood-reblooms:Traits:undead:text': 你的皮肤失去了血色，摸上去一片冰凉。胸口已没有心跳，你却仍能走动、说话。<span class="tealhair">不受冷热影响</span>。
'deadwood-reblooms:Traits:ravenFeathers:name': 玄翎
'deadwood-reblooms:Traits:ravenFeathers:text': 你的羽毛缓冲了击打。物理攻击造成的疼痛<span class="green">降低 15%</span>。
'deadwood-reblooms:Traits:raven:gender': 鸦<<pcGender>><<deadwood-trait-sex>>
'deadwood-reblooms:Traits:raven:text': 你的声音更有感染力。遭遇战中的言语行动<span class="teal">效果提高 25%</span>。
'deadwood-reblooms:Traits:ominousVoice:name': 不祥谶言
'deadwood-reblooms:Traits:ominousVoice:text': 你的话语直击痛处。“讥讽”每场遭遇战可使用两次，自控恢复与创伤减轻翻倍。每次<span class="green">缓解当前疼痛的 15%</span>。
'deadwood-reblooms:Traits:foxfire:name': 狐火
'deadwood-reblooms:Traits:foxfire:text': 圣光缠绕你的尾尖。<span class="gold">“放逐”会波及另一条触手</span>。
'deadwood-reblooms:Traits:cherishedWish:name': 心有所寄
'deadwood-reblooms:Traits:cherishedWish:text': 这里挂着你的心事。坐下来时，你终于能松一口气。每日在黯羽神社祈愿，<span class="green">额外减轻1点创伤</span>。
'deadwood-reblooms:Traits:springglow:name': 春晖
'deadwood-reblooms:Traits:springglow:text': 从扶正枝条到满篮收成，你渐渐摸熟了照料植物的门道。<span class="green">有效护理提高7%</span>。
