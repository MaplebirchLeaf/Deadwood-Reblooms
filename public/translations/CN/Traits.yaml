# Traits translations
'deadwood-reblooms:Traits:hooves:name': 蹄足
'deadwood-reblooms:Traits:hooves:text': 踢击的反抗效果提高至三倍。
'deadwood-reblooms:combat:hooves:kick:1': 你猛然踢出，沉重的蹄足狠狠砸向对手。
'deadwood-reblooms:combat:hooves:kick:2': 你的蹄足破空而至，迸发出骇人的力量。
'deadwood-reblooms:combat:hooves:kick:3': 你以蹄足发起重击，震得对手猝不及防。
'deadwood-reblooms:Traits:sweatblood:name': 汗血
'deadwood-reblooms:Traits:sweatblood:text': 温度对你的影响降低。
'deadwood-reblooms:Traits:horse:name': 马
'deadwood-reblooms:Traits:horse:gender': 马<<pcGender>>
'deadwood-reblooms:Traits:horse:text': 你渴望奔跑。疲劳积累得更慢。你的耳朵和尾巴让你更加显眼。
'deadwood-reblooms:Traits:gills:name': 深潜
'deadwood-reblooms:Traits:gills:text': 水下氧气消耗减少75%。
'deadwood-reblooms:Traits:finnedLimbs:name': 鳍肢
'deadwood-reblooms:Traits:finnedLimbs:text': 游泳技能提高10%。
'deadwood-reblooms:Traits:fish:name': 鱼
'deadwood-reblooms:Traits:fish:gender': 鱼<<pcGender>>
'deadwood-reblooms:Traits:fish:text': 水下行动所需的时间减半。
'deadwood-reblooms:Traits:ravenFeathers:name': 玄翎
'deadwood-reblooms:Traits:ravenFeathers:text': 你的羽毛缓冲了击打。物理攻击造成的疼痛降低15%。
'deadwood-reblooms:Traits:raven:name': 鸦
'deadwood-reblooms:Traits:raven:gender': 鸦<<pcGender>>
'deadwood-reblooms:Traits:raven:text': 你的声音更有感染力。遭遇战中的言语行动效果提高25%。
'deadwood-reblooms:Traits:ominousVoice:name': 不祥之声
'deadwood-reblooms:Traits:ominousVoice:text': 你的话语直击痛处。“讥讽”每场遭遇战可使用两次，恢复的自控与减轻的创伤翻倍。每次缓解当前疼痛的15%。
