# Traits translations
'deadwood-reblooms:Traits:hooves:name': 蹄足
'deadwood-reblooms:Traits:hooves:text': 踢会造成三倍的伤害。
'deadwood-reblooms:combat:hooves:kick:1': 你猛然踢出，沉重的蹄足狠狠砸向对手。
'deadwood-reblooms:combat:hooves:kick:2': 你的蹄足破空而至，迸发出骇人的力量。
'deadwood-reblooms:combat:hooves:kick:3': 你以蹄足发起重击，震得对手猝不及防。
'deadwood-reblooms:Traits:sweatblood:name': 汗血
'deadwood-reblooms:Traits:sweatblood:text': 温度对你的影响降低。
'deadwood-reblooms:Traits:horse:text': 你产生了奔跑的冲动。你的疲劳积累得更慢。你的耳朵和尾巴让你更加显眼。
'deadwood-reblooms:Traits:gills:name': 深潜
'deadwood-reblooms:Traits:gills:text': 你在水下消耗的氧气减少75%。
'deadwood-reblooms:Traits:finnedLimbs:name': 鳍肢
'deadwood-reblooms:Traits:finnedLimbs:text': 你的游泳技能提高10%。
'deadwood-reblooms:Traits:fish:text': 你在水下行动所需的时间减半。
