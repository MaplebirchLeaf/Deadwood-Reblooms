# Robin expansion links
'deadwood-reblooms:robin:trait:solidarity:name': 同舟共济
'deadwood-reblooms:robin:trait:solidarity:text': 罗宾付清旧债，与你各自承担房租。在家相伴会减轻少量压力。
'deadwood-reblooms:robin:trait:protected:name': 相依为命
'deadwood-reblooms:robin:trait:protected:text': 罗宾有余力时会分担你的房租。在家相伴会减轻更多压力。
'deadwood-reblooms:robin:trait:free:name': 贝利之敌
'deadwood-reblooms:robin:trait:free:text': 你们让贝利放弃向孤儿收租。在家相伴会减轻压力。
'deadwood-reblooms:robin:feat:Deadwood Robin Independent:name': 谁说罗宾不会算账
'deadwood-reblooms:robin:feat:Deadwood Robin Independent:text': 帮罗宾结清旧债，并开始承担自己的房租。
'deadwood-reblooms:robin:feat:Deadwood Robin Together:name': 这周我来付
'deadwood-reblooms:robin:feat:Deadwood Robin Together:text': 与罗宾约好共同面对房租。
'deadwood-reblooms:robin:feat:Deadwood Robin Free:name': 贝利，账清了
'deadwood-reblooms:robin:feat:Deadwood Robin Free:text': 与罗宾及其他孤儿站在一起，直到贝利放弃向你们收租。
'deadwood-reblooms:robin:feat:Deadwood Robin Shop Open:name': 蜜雪冰城
'deadwood-reblooms:robin:feat:Deadwood Robin Shop Open:text': 与罗宾一起在峭壁街开店。
